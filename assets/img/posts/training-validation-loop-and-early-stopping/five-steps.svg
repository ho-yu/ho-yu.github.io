<svg width="720" height="340" viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="720" height="340" fill="#f6f8fa" rx="10"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6.4" refY="3" orient="auto"><path d="M0,0 L6.4,3 L0,6 z" fill="#57606a"/></marker></defs>
  <text x="360" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-weight="700">한 mini-batch를 학습하는 5단계</text>
  <rect x="40" y="52" width="640" height="46" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="70" cy="75" r="14" fill="#ffffff" stroke="#57606a" stroke-width="1.6"/>
  <text x="70" y="80" font-size="13" fill="#57606a" text-anchor="middle" font-weight="700">1</text>
  <text x="98" y="80" font-size="12" fill="#24292f" font-weight="700" font-family="ui-monospace, monospace">optimizer.zero_grad()</text>
  <text x="352" y="80" font-size="11.5" fill="#57606a">이전 batch에서 남은 gradient를 초기화한다</text>
  <line x1="70" y1="100" x2="70" y2="104" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="40" y="106" width="640" height="46" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="70" cy="129" r="14" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
  <text x="70" y="134" font-size="13" fill="#0969da" text-anchor="middle" font-weight="700">2</text>
  <text x="98" y="134" font-size="12" fill="#24292f" font-weight="700" font-family="ui-monospace, monospace">logits = model(images)</text>
  <text x="352" y="134" font-size="11.5" fill="#57606a">현재 parameter로 예측 점수를 계산한다</text>
  <line x1="70" y1="154" x2="70" y2="158" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="40" y="160" width="640" height="46" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="70" cy="183" r="14" fill="#ffffff" stroke="#9a6700" stroke-width="1.6"/>
  <text x="70" y="188" font-size="13" fill="#9a6700" text-anchor="middle" font-weight="700">3</text>
  <text x="98" y="188" font-size="12" fill="#24292f" font-weight="700" font-family="ui-monospace, monospace">loss = criterion(logits, labels)</text>
  <text x="352" y="188" font-size="11.5" fill="#57606a">예측이 정답과 얼마나 다른지 계산한다</text>
  <line x1="70" y1="208" x2="70" y2="212" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="40" y="214" width="640" height="46" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="70" cy="237" r="14" fill="#ffffff" stroke="#8250df" stroke-width="1.6"/>
  <text x="70" y="242" font-size="13" fill="#8250df" text-anchor="middle" font-weight="700">4</text>
  <text x="98" y="242" font-size="12" fill="#24292f" font-weight="700" font-family="ui-monospace, monospace">loss.backward()</text>
  <text x="352" y="242" font-size="11.5" fill="#57606a">parameter.grad에 gradient를 계산해 저장한다</text>
  <line x1="70" y1="262" x2="70" y2="266" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="40" y="268" width="640" height="46" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="70" cy="291" r="14" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/>
  <text x="70" y="296" font-size="13" fill="#1a7f37" text-anchor="middle" font-weight="700">5</text>
  <text x="98" y="296" font-size="12" fill="#24292f" font-weight="700" font-family="ui-monospace, monospace">optimizer.step()</text>
  <text x="352" y="296" font-size="11.5" fill="#57606a">gradient를 참고해 parameter를 실제로 수정한다</text>
</svg>
