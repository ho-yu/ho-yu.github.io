<svg width="360" height="320" viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ah-blue2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2f6feb"/>
    </marker>
    <marker id="ah-red2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#cf222e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="360" height="320" fill="#f6f8fa" rx="10"/>
  <text x="180" y="18" font-size="16" font-weight="700" fill="#24292f" text-anchor="middle">정규화: 방향은 유지, 길이만 1로</text>

  <g transform="translate(20,26)">
    <!-- light grid -->
    <path d="M40,34 L40,274 M80,34 L80,274 M120,34 L120,274 M160,34 L160,274 M200,34 L200,274 M240,34 L240,274 M280,34 L280,274
             M40,274 L280,274 M40,234 L280,234 M40,194 L280,194 M40,154 L280,154 M40,114 L280,114 M40,74 L280,74 M40,34 L280,34"
          stroke="#d0d7de" stroke-width="0.75" opacity="0.7"/>

    <!-- unit circle (radius = 1 = 40px) -->
    <circle cx="80" cy="234" r="40" fill="none" stroke="#8c959f" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- axes -->
    <line x1="40" y1="234" x2="280" y2="234" stroke="#8c959f" stroke-width="1.5"/>
    <line x1="80" y1="274" x2="80" y2="34" stroke="#8c959f" stroke-width="1.5"/>

    <!-- v = (3,4), length 5 -->
    <line x1="80" y1="234" x2="197" y2="77" stroke="#2f6feb" stroke-width="2.5" marker-end="url(#ah-blue2)"/>
    <text x="196" y="70" font-size="14" fill="#2f6feb" font-family="ui-monospace, monospace" text-anchor="middle">(3, 4) · 길이 5</text>

    <!-- unit_v = (0.6, 0.8), length 1 -->
    <line x1="80" y1="234" x2="101" y2="205" stroke="#cf222e" stroke-width="2.5" marker-end="url(#ah-red2)"/>
    <text x="150" y="222" font-size="14" fill="#cf222e" font-family="ui-monospace, monospace">(0.6, 0.8) · 길이 1</text>
  </g>

  <text x="180" y="308" font-size="13" fill="#57606a" text-anchor="middle">두 벡터는 원점에서 같은 직선 위에 있다 — 방향이 같다는 뜻이다</text>
</svg>
