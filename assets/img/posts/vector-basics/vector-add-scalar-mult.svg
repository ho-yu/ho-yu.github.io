<svg width="640" height="300" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ah-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2f6feb"/>
    </marker>
    <marker id="ah-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#059669"/>
    </marker>
    <marker id="ah-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#cf222e"/>
    </marker>
    <marker id="ah-red-light" markerWidth="9" markerHeight="9" refX="6.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#f2a5a5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="300" fill="#f6f8fa" rx="10"/>

  <!-- Panel A: 벡터의 덧셈 -->
  <g transform="translate(20,20)">
    <text x="148" y="17" font-size="16" font-weight="700" fill="#24292f" text-anchor="middle">벡터의 덧셈: a + b</text>

    <!-- light grid -->
    <path d="M40,34 L40,214 M76,34 L76,214 M112,34 L112,214 M148,34 L148,214 M184,34 L184,214 M220,34 L220,214 M256,34 L256,214
             M40,214 L256,214 M40,178 L256,178 M40,142 L256,142 M40,106 L256,106 M40,70 L256,70 M40,34 L256,34"
          stroke="#d0d7de" stroke-width="0.75" opacity="0.7"/>

    <!-- axes -->
    <line x1="40" y1="178" x2="256" y2="178" stroke="#8c959f" stroke-width="1.5"/>
    <line x1="76" y1="214" x2="76" y2="34" stroke="#8c959f" stroke-width="1.5"/>

    <!-- vector a: origin(0,0) -> (1,2) -->
    <line x1="76" y1="178" x2="110" y2="108" stroke="#2f6feb" stroke-width="2.5" marker-end="url(#ah-blue)"/>
    <text x="82" y="140" font-size="14" fill="#2f6feb" font-family="ui-monospace, monospace">a=(1,2)</text>

    <!-- vector b placed at a's tip: (1,2) -> (4,3) -->
    <line x1="112" y1="106" x2="218" y2="72" stroke="#059669" stroke-width="2.5" marker-end="url(#ah-green)"/>
    <text x="150" y="82" font-size="14" fill="#059669" font-family="ui-monospace, monospace">b=(3,1)</text>

    <!-- resultant a+b: origin -> (4,3) -->
    <line x1="76" y1="178" x2="218" y2="72" stroke="#cf222e" stroke-width="2.5" marker-end="url(#ah-red)"/>
    <text x="196" y="240" font-size="14" fill="#cf222e" font-family="ui-monospace, monospace">a+b=(4,3)</text>

    <text x="148" y="260" font-size="13" fill="#57606a" text-anchor="middle">a의 끝에 b를 이어 붙이면 도착점이 a+b</text>
  </g>

  <!-- Panel B: 스칼라 곱 -->
  <g transform="translate(340,20)">
    <text x="118" y="17" font-size="16" font-weight="700" fill="#24292f" text-anchor="middle">스칼라 곱: 2v</text>

    <!-- light grid -->
    <path d="M40,34 L40,242 M66,34 L66,242 M92,34 L92,242 M118,34 L118,242 M144,34 L144,242 M170,34 L170,242 M196,34 L196,242
             M40,34 L196,34 M40,60 L196,60 M40,86 L196,86 M40,112 L196,112 M40,138 L196,138 M40,164 L196,164 M40,190 L196,190 M40,216 L196,216 M40,242 L196,242"
          stroke="#d0d7de" stroke-width="0.75" opacity="0.7"/>

    <!-- axes -->
    <line x1="40" y1="216" x2="196" y2="216" stroke="#8c959f" stroke-width="1.5"/>
    <line x1="66" y1="242" x2="66" y2="34" stroke="#8c959f" stroke-width="1.5"/>

    <!-- 2v drawn first (lighter, thicker) so v is visible on top of the same line -->
    <line x1="66" y1="216" x2="167" y2="63" stroke="#f2a5a5" stroke-width="5" marker-end="url(#ah-red-light)"/>
    <!-- v -->
    <line x1="66" y1="216" x2="116" y2="140" stroke="#2f6feb" stroke-width="2.5" marker-end="url(#ah-blue)"/>

    <text x="122" y="150" font-size="14" fill="#2f6feb" font-family="ui-monospace, monospace">v=(2,3)</text>
    <text x="172" y="60" font-size="14" fill="#cf222e" font-family="ui-monospace, monospace">2v=(4,6)</text>

    <text x="118" y="270" font-size="13" fill="#57606a" text-anchor="middle">방향은 그대로, 길이만 2배</text>
  </g>
</svg>
