<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1020" viewBox="0 0 680 1020" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Malgun Gothic, sans-serif">
<title id="title">중첩 with의 정상 완료 흐름</title>
<desc id="desc">외부 policy-qa 구간 안에서 내부 retrieve 구간을 시작하고 검색과 문서 ID 기록 후 종료한다. 외부 구간은 계속 활성화된 상태로 입력 구성, invoke 모델 호출, 응답 검사, 최종 출력 기록을 수행한다. 외부 구간을 종료한 다음 result를 반환한다. 오류가 발생하면 이후 정상 완료 단계로 진행하지 않는다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#57606a"/></marker></defs>
<rect width="680" height="1020" rx="16" fill="#f6f8fa"/>
<text x="340" y="44" text-anchor="middle" font-size="30" font-weight="700" fill="#24292f">with 진입 → 작업 → 구간 종료</text>
<text x="340" y="81" text-anchor="middle" font-size="26" fill="#57606a">answer()의 정상 완료 경로</text>
<rect x="24" y="109" width="632" height="800" rx="14" fill="#eaf2ff" stroke="#0969da" stroke-width="2"/>
<text x="340" y="156" text-anchor="middle" font-size="31" font-weight="700" fill="#0969da">외부 with · policy-qa</text>
<rect x="62" y="184" width="556" height="170" rx="12" fill="#e9f5ed" stroke="#1a7f37" stroke-width="2"/>
<text x="340" y="229" text-anchor="middle" font-size="30" font-weight="700" fill="#1a7f37">내부 with · retrieve</text>
<text x="340" y="276" text-anchor="middle" font-size="29" fill="#24292f">질문 → 검색 → 문서 ID 기록</text>
<text x="340" y="323" text-anchor="middle" font-size="27" fill="#1a7f37">내부 종료: 검색 구간만 끝남</text>
<line x1="340" y1="361" x2="340" y2="395" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="340" y="433" text-anchor="middle" font-size="28" fill="#0969da">외부 구간은 계속 활성</text>
<rect x="84" y="465" width="512" height="74" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<text x="340" y="512" text-anchor="middle" font-size="29" fill="#24292f">문서·질문으로 입력 구성</text>
<line x1="340" y1="547" x2="340" y2="576" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="84" y="590" width="512" height="74" rx="10" fill="#f2edff" stroke="#8250df" stroke-width="2"/>
<text x="340" y="637" text-anchor="middle" font-size="30" fill="#6639ba">invoke: 모델 호출</text>
<line x1="340" y1="672" x2="340" y2="701" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="84" y="715" width="512" height="74" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<text x="340" y="762" text-anchor="middle" font-size="29" fill="#24292f">응답 검사 → 결과 구성</text>
<line x1="340" y1="797" x2="340" y2="826" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="340" y="870" text-anchor="middle" font-size="28" fill="#24292f">root.update: 최종 출력 기록</text>
<line x1="340" y1="917" x2="340" y2="951" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="340" y="994" text-anchor="middle" font-size="30" font-weight="700" fill="#24292f">외부 종료 → result 반환</text>
</svg>
