<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Malgun Gothic, sans-serif">
<title id="title">응답 완료, 내용 평가, 서버 기록 확인의 구분</title>
<desc id="desc">응답 완료는 상태와 비어 있지 않은 출력으로 검사한다. 내용 평가는 근거, 필수 조건, 출처의 일치를 검사한다. 서버 기록은 같은 Trace ID로 다시 조회해 확인한다. 어느 한 검사를 통과해도 나머지 검사의 통과를 보장하지 않는다.</desc>
<rect width="680" height="500" rx="16" fill="#f6f8fa"/>
<text x="340" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#24292f">서로 다른 세 가지 확인</text>
<rect x="24" y="80" width="632" height="102" rx="12" fill="#eaf2ff" stroke="#0969da" stroke-width="2"/>
<text x="48" y="122" font-size="30" font-weight="700" fill="#0969da">응답 완료</text>
<text x="48" y="162" font-size="28" fill="#24292f">완료 상태 + 비어 있지 않은 출력</text>
<rect x="24" y="202" width="632" height="102" rx="12" fill="#e9f5ed" stroke="#1a7f37" stroke-width="2"/>
<text x="48" y="244" font-size="30" font-weight="700" fill="#1a7f37">내용 평가</text>
<text x="48" y="284" font-size="28" fill="#24292f">근거 · 필수 조건 · 출처 일치</text>
<rect x="24" y="324" width="632" height="102" rx="12" fill="#f2edff" stroke="#8250df" stroke-width="2"/>
<text x="48" y="366" font-size="30" font-weight="700" fill="#6639ba">서버 기록 확인</text>
<text x="48" y="406" font-size="28" fill="#24292f">같은 Trace ID로 다시 조회</text>
<text x="340" y="474" text-anchor="middle" font-size="29" font-weight="700" fill="#24292f">완료됐어도 내용은 틀릴 수 있다</text>
</svg>
