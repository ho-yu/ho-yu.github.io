  <text x="200.0" y="146.99685867340116" font-size="10.5" fill="#cf222e" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">loss ≈ 2.30</text>
  <line x1="586.0" y1="236.11046956312043" x2="586.0" y2="240" stroke="#1a7f37" stroke-width="1.2" stroke-dasharray="4 3"/>
