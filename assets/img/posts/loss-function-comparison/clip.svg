  <line x1="100.0" y1="125" x2="100.0" y2="137" stroke="#57606a" stroke-width="1.4"/>
  <text x="100.0" y="158" font-size="10" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">-1</text>
  <line x1="273.33333333333337" y1="125" x2="273.33333333333337" y2="137" stroke="#57606a" stroke-width="1.4"/>
  <text x="273.33333333333337" y="158" font-size="10" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">0</text>
  <line x1="446.6666666666667" y1="125" x2="446.6666666666667" y2="137" stroke="#57606a" stroke-width="1.4"/>
  <text x="446.6666666666667" y="158" font-size="10" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">1</text>
  <line x1="620.0" y1="125" x2="620.0" y2="137" stroke="#57606a" stroke-width="1.4"/>
  <text x="620.0" y="158" font-size="10" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">2</text>
  <text x="360.0" y="110" font-size="10" fill="#1a7f37" text-anchor="middle" font-weight="700">허용 범위</text>
  <text x="186.66666666666669" y="78" font-size="11" fill="#cf222e" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">-0.5</text>
  <line x1="186.66666666666669" y1="86" x2="273.33333333333337" y2="114" stroke="#cf222e" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="273.33333333333337" y="184" font-size="10.5" fill="#1a7f37" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">→ 0</text>
  <text x="325.33333333333337" y="78" font-size="11" fill="#0969da" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">0.3</text>
  <line x1="325.33333333333337" y1="86" x2="325.33333333333337" y2="114" stroke="#0969da" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="325.33333333333337" y="184" font-size="10.5" fill="#1a7f37" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">→ 0.3</text>
  <text x="568.0" y="78" font-size="11" fill="#cf222e" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">1.7</text>
  <line x1="568.0" y1="86" x2="446.6666666666667" y2="114" stroke="#cf222e" stroke-width="1.4" marker-end="url(#ar)"/>
