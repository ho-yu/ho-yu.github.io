  <text x="360" y="214" font-size="11.5" fill="#24292f" text-anchor="middle">BCE에서는 [epsilon, 1 − epsilon] 범위로 확률을 제한해 log(0)을 피한다</text>
  <text x="360" y="238" font-size="11" fill="#57606a" text-anchor="middle">실무에서는 logits를 직접 받는 BCEWithLogitsLoss를 쓰기도 한다</text>
