<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" aria-label="단기·장기 메모리의 사용 범위와 검색 예" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Malgun Gothic, sans-serif">
<rect width="680" height="560" rx="16" fill="#f6f8fa"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#57606a"/></marker></defs>
<rect x="24" y="24" width="632" height="130" rx="12" fill="#e9f5ed" stroke="#d0d7de"/>
<text x="48" y="68" font-size="28" fill="#1a7f37" font-weight="700" text-anchor="start">단기 메모리 · 현재 대화·작업</text>
<text x="48" y="116" font-size="26" fill="#24292f" font-weight="400" text-anchor="start">예: 방금 고른 상품</text>
<rect x="24" y="174" width="632" height="130" rx="12" fill="#eaf2ff" stroke="#d0d7de"/>
<text x="48" y="218" font-size="28" fill="#0969da" font-weight="700" text-anchor="start">장기 메모리 · 다른 대화에서도 활용</text>
<text x="48" y="266" font-size="26" fill="#24292f" font-weight="400" text-anchor="start">예: “항상 한국어로 답해줘”</text>
<text x="340" y="354" font-size="27" fill="#24292f" font-weight="700" text-anchor="middle">기억 검색을 사용하는 예</text>
<rect x="24" y="394" width="164" height="74" rx="12" fill="#e9f5ed" stroke="#d0d7de"/>
<text x="106" y="440" font-size="25" fill="#1a7f37" font-weight="700" text-anchor="middle">기억 보관</text>
<rect x="258" y="394" width="164" height="74" rx="12" fill="#eaf2ff" stroke="#d0d7de"/>
<text x="340" y="440" font-size="25" fill="#0969da" font-weight="700" text-anchor="middle">필요한 기억</text>
<rect x="492" y="394" width="164" height="74" rx="12" fill="#f2edff" stroke="#d0d7de"/>
<text x="574" y="440" font-size="25" fill="#8250df" font-weight="700" text-anchor="middle">이번 입력</text>
<line x1="192" y1="432" x2="252" y2="432" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="426" y1="432" x2="486" y2="432" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="221" y="406" font-size="21" fill="#57606a" font-weight="400" text-anchor="middle">검색</text>
<text x="455" y="406" font-size="21" fill="#57606a" font-weight="400" text-anchor="middle">활용</text>
<text x="340" y="520" font-size="24" fill="#57606a" font-weight="400" text-anchor="middle">벡터 검색 외에 ID·키 조회도 가능</text>
</svg>