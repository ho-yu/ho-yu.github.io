<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img" aria-label="KV, Prefix, 응답 캐시의 재사용 대상" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Malgun Gothic, sans-serif">
<rect width="680" height="450" rx="16" fill="#f6f8fa"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#57606a"/></marker></defs>
<text x="340" y="44" font-size="29" fill="#24292f" font-weight="700" text-anchor="middle">재사용하는 대상이 다르다</text>
<rect x="24" y="70" width="632" height="102" rx="12" fill="#e9f5ed" stroke="#d0d7de"/>
<text x="44" y="128" font-size="27" fill="#1a7f37" font-weight="700" text-anchor="start">KV 캐시</text>
<text x="234" y="109" font-size="25" fill="#24292f" font-weight="400" text-anchor="start">생성 중 앞선 토큰의 K·V</text>
<text x="234" y="148" font-size="23" fill="#57606a" font-weight="400" text-anchor="start">문장을 이어서 생성할 때</text>
<rect x="24" y="188" width="632" height="102" rx="12" fill="#eaf2ff" stroke="#d0d7de"/>
<text x="44" y="246" font-size="27" fill="#0969da" font-weight="700" text-anchor="start">Prefix 캐시</text>
<text x="234" y="227" font-size="25" fill="#24292f" font-weight="400" text-anchor="start">요청 간 같은 앞부분의 K·V</text>
<text x="234" y="266" font-size="23" fill="#57606a" font-weight="400" text-anchor="start">같은 규정 + 서로 다른 질문</text>
<rect x="24" y="306" width="632" height="102" rx="12" fill="#f2edff" stroke="#d0d7de"/>
<text x="44" y="364" font-size="27" fill="#8250df" font-weight="700" text-anchor="start">응답 캐시</text>
<text x="234" y="345" font-size="25" fill="#24292f" font-weight="400" text-anchor="start">조건에 맞는 완성된 답변</text>
<text x="234" y="384" font-size="23" fill="#57606a" font-weight="400" text-anchor="start">저장된 답변 반환</text>
</svg>