<svg xmlns="http://www.w3.org/2000/svg" width="640" height="296" viewBox="0 0 640 296" role="img" aria-labelledby="title desc">
  <title id="title">답변 전용 SFT의 입력과 정답</title>
  <desc id="desc">가상의 토큰 10, 11, 20, 21, 99를 모두 입력하고 attention_mask를 모두 1로 둔다. labels에서는 프롬프트의 10과 11 대신 -100을 넣어 손실을 무시하며, 답변 20과 21 및 종료 토큰 99는 유지한다.</desc>
  <rect width="640" height="296" rx="20" fill="#F5F4EF"/>
  <g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" text-anchor="middle">
    <rect x="226" y="20" width="148" height="42" rx="9" fill="#E7EFFA"/>
    <text x="300" y="49" fill="#315D92" font-size="25" font-weight="700">프롬프트</text>
    <rect x="382" y="20" width="148" height="42" rx="9" fill="#E3F0EA"/>
    <text x="456" y="49" fill="#155F54" font-size="25" font-weight="700">답변</text>
    <rect x="538" y="20" width="70" height="42" rx="9" fill="#EEE8F6"/>
    <text x="573" y="49" fill="#654882" font-size="25" font-weight="700">EOS</text>
  </g>
  <g fill="#FFFFFF">
    <rect x="226" y="73" width="382" height="44" rx="9"/>
    <rect x="226" y="126" width="382" height="44" rx="9"/>
  </g>
  <rect x="226" y="179" width="148" height="44" rx="9" fill="#E4E8EE"/>
  <rect x="382" y="179" width="226" height="44" rx="9" fill="#D5EBE3"/>
  <g fill="#233A3B" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="23">
    <text x="25" y="103">input_ids</text>
    <text x="25" y="156">attention_mask</text>
    <text x="25" y="209">labels</text>
    <g font-size="27" text-anchor="middle">
      <text y="104"><tspan x="261">10</tspan><tspan x="339">11</tspan><tspan x="417">20</tspan><tspan x="495">21</tspan><tspan x="573">99</tspan></text>
      <text y="157"><tspan x="261">1</tspan><tspan x="339">1</tspan><tspan x="417">1</tspan><tspan x="495">1</tspan><tspan x="573">1</tspan></text>
      <text y="210"><tspan x="261">-100</tspan><tspan x="339">-100</tspan><tspan x="417" font-weight="700">20</tspan><tspan x="495" font-weight="700">21</tspan><tspan x="573" font-weight="700">99</tspan></text>
    </g>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M226 231v10h148v-10" stroke="#677686"/>
    <path d="M382 231v10h226v-10" stroke="#287668"/>
  </g>
  <g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    <text x="300" y="274" fill="#4A5767">손실 제외</text>
    <text x="495" y="274" fill="#155F54">손실 계산</text>
  </g>
</svg>
