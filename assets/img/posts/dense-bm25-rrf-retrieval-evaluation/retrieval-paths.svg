<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" role="img" aria-labelledby="title"><title id="title">같은 질문과 청크를 두 검색기로 검색하고 순위를 융합하는 흐름</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#177B72"/></marker></defs><rect width="680" height="590" rx="20" fill="#F5F4EF"/><g font-family="NanumSquareRound, Malgun Gothic, sans-serif"><text x="30" y="48" fill="#233A3B" font-size="30" font-weight="700">같은 질문 · 같은 문서 청크</text><rect x="30" y="100" width="295" height="170" rx="16" fill="#E4F2EC"/><text x="52" y="141" fill="#177B72" font-size="30" font-weight="700">Dense</text><text x="52" y="189" fill="#233A3B" font-size="25" font-weight="400">텍스트 → 임베딩</text><text x="52" y="232" fill="#233A3B" font-size="25" font-weight="400">벡터 유사도로 정렬</text><rect x="355" y="100" width="295" height="170" rx="16" fill="#EAF1FC"/><text x="377" y="141" fill="#4476B5" font-size="30" font-weight="700">BM25</text><text x="377" y="189" fill="#233A3B" font-size="25" font-weight="400">텍스트 → 토큰</text><text x="377" y="232" fill="#233A3B" font-size="25" font-weight="400">단어 통계로 정렬</text><path d="M177 280 L260 335" fill="none" stroke="#177B72" stroke-width="3" marker-end="url(#arrow)"/><path d="M502 280 L420 335" fill="none" stroke="#177B72" stroke-width="3" marker-end="url(#arrow)"/><rect x="110" y="345" width="460" height="85" rx="16" fill="#E4F2EC"/><text x="155" y="399" fill="#233A3B" font-size="26" font-weight="700">RRF · 같은 청크의 순위 융합</text><path d="M340 440 L340 478" fill="none" stroke="#177B72" stroke-width="3" marker-end="url(#arrow)"/><text x="118" y="525" fill="#233A3B" font-size="26" font-weight="400">후보 → 선택적 리랭킹 → 답변 생성</text><text x="108" y="566" fill="#647674" font-size="24" font-weight="400">검색 성능과 답변 품질은 따로 평가</text></g></svg>