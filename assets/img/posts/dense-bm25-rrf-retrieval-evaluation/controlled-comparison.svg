<svg xmlns="http://www.w3.org/2000/svg" width="680" height="550" viewBox="0 0 680 550" role="img" aria-labelledby="title"><title id="title">데이터 질문 정답 top-k 지표를 고정해 검색기 A와 B를 비교</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#177B72"/></marker></defs><rect width="680" height="550" rx="20" fill="#F5F4EF"/><g font-family="NanumSquareRound, Malgun Gothic, sans-serif"><text x="30" y="48" fill="#233A3B" font-size="30" font-weight="700">공정한 비교: 검색 방식 외 조건 고정</text><rect x="30" y="80" width="620" height="150" rx="16" fill="#E4F2EC"/><text x="55" y="120" fill="#233A3B" font-size="27" font-weight="400">같은 청크 ID · 본문 · 전처리 버전</text><text x="55" y="165" fill="#233A3B" font-size="27" font-weight="400">같은 질문 · 정답 근거 · 제외 기준</text><text x="55" y="210" fill="#233A3B" font-size="27" font-weight="400">같은 top-k · 지표 · 시간 측정 범위</text><path d="M215 241 L177 285" fill="none" stroke="#177B72" stroke-width="3" marker-end="url(#arrow)"/><path d="M465 241 L502 285" fill="none" stroke="#177B72" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="300" width="295" height="80" rx="16" fill="#E4F2EC"/><text x="88" y="350" fill="#177B72" font-size="29" font-weight="700">검색 방식 A</text><rect x="355" y="300" width="295" height="80" rx="16" fill="#EAF1FC"/><text x="413" y="350" fill="#4476B5" font-size="29" font-weight="700">검색 방식 B</text><text x="35" y="437" fill="#233A3B" font-size="27" font-weight="700">청크 수만 같아도 내용은 다를 수 있음</text><text x="35" y="485" fill="#233A3B" font-size="25" font-weight="400">답변 평가: 모델·프롬프트·문맥도 고정</text><text x="35" y="525" fill="#647674" font-size="24" font-weight="400">검색 후보 수 ≠ 최종 문맥 개수일 수 있음</text></g></svg>