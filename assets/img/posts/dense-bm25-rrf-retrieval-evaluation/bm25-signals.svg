<svg xmlns="http://www.w3.org/2000/svg" width="680" height="475" viewBox="0 0 680 475" role="img" aria-labelledby="title"><title id="title">BM25의 빈도 포화와 희귀도 및 길이 정규화</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#177B72"/></marker></defs><rect width="680" height="475" rx="20" fill="#F5F4EF"/><g font-family="NanumSquareRound, Malgun Gothic, sans-serif"><text x="30" y="48" fill="#233A3B" font-size="30" font-weight="700">BM25: 일치한 토큰의 기여를 합산</text><rect x="30" y="80" width="620" height="90" rx="16" fill="#E4F2EC"/><text x="52" y="118" fill="#177B72" font-size="28" font-weight="700">TF · 해당 청크 안의 빈도</text><text x="52" y="154" fill="#233A3B" font-size="25" font-weight="400">양의 IDF: 반복 효과는 점점 포화</text><rect x="30" y="190" width="620" height="90" rx="16" fill="#EAF1FC"/><text x="52" y="228" fill="#4476B5" font-size="28" font-weight="700">IDF · 전체 청크에서의 희귀도</text><text x="52" y="264" fill="#233A3B" font-size="25" font-weight="400">드문 토큰을 대체로 더 강한 신호로</text><rect x="30" y="300" width="620" height="90" rx="16" fill="#F0EBF8"/><text x="52" y="338" fill="#7960A5" font-size="28" font-weight="700">길이 정규화 · 평균 길이와 비교</text><text x="52" y="374" fill="#233A3B" font-size="25" font-weight="400">같은 TF라면 긴 청크의 기여를 보정</text><text x="32" y="441" fill="#647674" font-size="25" font-weight="400">토큰화·IDF 식·보정 규칙은 구현별로 확인</text></g></svg>