<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img" aria-labelledby="title"><title id="title">임베딩과 코사인 유사도의 의미 및 주의 조건</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#177B72"/></marker></defs><rect width="680" height="480" rx="20" fill="#F5F4EF"/><g font-family="NanumSquareRound, Malgun Gothic, sans-serif"><text x="30" y="48" fill="#233A3B" font-size="30" font-weight="700">Dense: 표현을 벡터로 바꾸어 비교</text><rect x="30" y="82" width="620" height="65" rx="16" fill="#E4F2EC"/><text x="57" y="125" fill="#233A3B" font-size="29" font-weight="400">“신청 마감” ↔ “접수 종료일”</text><path d="M340 158 L340 195" fill="none" stroke="#177B72" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="208" width="540" height="80" rx="16" fill="#EAF1FC"/><text x="117" y="258" fill="#233A3B" font-size="26" font-weight="400">같은 모델의 벡터 → 유사도 순위</text><text x="35" y="340" fill="#233A3B" font-size="26" font-weight="700">코사인: cos(q,d) = (q·d) / (‖q‖‖d‖)</text><text x="35" y="391" fill="#233A3B" font-size="26" font-weight="400">영벡터 제외 · 범위 −1~1 · 확률 아님</text><text x="35" y="445" fill="#647674" font-size="25" font-weight="400">코드·숫자·조건의 정확한 일치는 별도 확인</text></g></svg>