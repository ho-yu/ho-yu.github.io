<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img" aria-labelledby="title"><title id="title">가상 순위 예시에서 RRF 점수로 B가 A보다 앞서는 계산</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#177B72"/></marker></defs><rect width="680" height="540" rx="20" fill="#F5F4EF"/><g font-family="NanumSquareRound, Malgun Gothic, sans-serif"><text x="30" y="48" fill="#233A3B" font-size="30" font-weight="700">RRF: 원점수 대신 순위별 기여</text><rect x="30" y="83" width="620" height="75" rx="16" fill="#E4F2EC"/><text x="60" y="131" fill="#233A3B" font-size="27" font-weight="400">기여 = 1 / (c + 순위) · 순위는 1부터</text><text x="40" y="209" fill="#647674" font-size="26" font-weight="400">가상 예시 · c=60</text><text x="40" y="260" fill="#177B72" font-size="29" font-weight="700">Dense:  A → B → C</text><text x="40" y="309" fill="#4476B5" font-size="29" font-weight="700">BM25:   B → D → A</text><rect x="30" y="340" width="620" height="117" rx="16" fill="#FFFFFF"/><text x="52" y="383" fill="#233A3B" font-size="28" font-weight="400">A: 1/61 + 1/63 ≈ 0.03227</text><text x="52" y="429" fill="#233A3B" font-size="28" font-weight="400">B: 1/62 + 1/61 ≈ 0.03252</text><text x="35" y="504" fill="#233A3B" font-size="25" font-weight="700">따라서 B가 앞섬 · 없는 목록의 기여는 0</text></g></svg>