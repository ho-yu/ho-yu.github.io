<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650" role="img" aria-labelledby="title"><title id="title">정책은 A 또는 B쪽, 예외는 C쪽이 필요할 때 A만 검색한 가상 예시</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#177B72"/></marker></defs><rect width="680" height="650" rx="20" fill="#F5F4EF"/><g font-family="NanumSquareRound, Malgun Gothic, sans-serif"><text x="30" y="48" fill="#233A3B" font-size="30" font-weight="700">필요한 근거: 정책 + 예외</text><text x="30" y="91" fill="#647674" font-size="25" font-weight="400">가상 예시 · 그룹마다 한 쪽이면 충족</text><rect x="30" y="123" width="620" height="140" rx="16" fill="#E4F2EC"/><text x="52" y="164" fill="#177B72" font-size="29" font-weight="700">정책 그룹: A쪽 또는 B쪽</text><rect x="52" y="185" width="255" height="55" rx="16" fill="#177B72"/><text x="72" y="223" fill="#FFFFFF" font-size="26" font-weight="700">A쪽 · 검색됨</text><text x="349" y="223" fill="#647674" font-size="26" font-weight="400">B쪽 · 미검색</text><rect x="30" y="283" width="620" height="110" rx="16" fill="#EAF1FC"/><text x="52" y="327" fill="#4476B5" font-size="29" font-weight="700">예외 그룹: C쪽 필요</text><text x="52" y="370" fill="#647674" font-size="26" font-weight="400">C쪽 · 미검색</text><rect x="30" y="415" width="620" height="170" rx="16" fill="#FFFFFF"/><text x="52" y="460" fill="#233A3B" font-size="27" font-weight="400">페이지 Hit = 1  · 정답 한 쪽 발견</text><text x="52" y="509" fill="#233A3B" font-size="27" font-weight="400">페이지 Recall = 1/3  · A,B,C 중 A</text><text x="52" y="558" fill="#233A3B" font-size="27" font-weight="400">그룹 커버리지 = 1/2  · 정책만 충족</text><text x="30" y="624" fill="#647674" font-size="25" font-weight="400">페이지 비율과 그룹 비율의 분모는 다름</text></g></svg>