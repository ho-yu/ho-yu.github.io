<svg width="960" height="300" viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="960" height="300" fill="#f6f8fa" rx="10"/>

  <!-- arrows between panels -->
  <text x="240" y="130" font-size="26" fill="#6e7781" text-anchor="middle" font-weight="bold">&#8594;</text>
  <text x="480" y="130" font-size="26" fill="#6e7781" text-anchor="middle" font-weight="bold">&#8594;</text>
  <text x="720" y="130" font-size="26" fill="#6e7781" text-anchor="middle" font-weight="bold">&#8594;</text>

  <!-- Panel 1: Scalar -->
  <g transform="translate(20,20)">
    <text x="100" y="16" font-size="15" font-weight="700" fill="#24292f" text-anchor="middle">Scalar · 0차원</text>
    <rect x="72" y="90" width="56" height="56" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="100" y="126" font-size="16" font-weight="700" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">7</text>
    <text x="100" y="200" font-size="12" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">torch.tensor(7)</text>
    <text x="100" y="222" font-size="12.5" fill="#0969da" text-anchor="middle" font-family="ui-monospace, monospace">shape: torch.Size([])</text>
  </g>

  <!-- Panel 2: Vector -->
  <g transform="translate(260,20)">
    <text x="100" y="16" font-size="15" font-weight="700" fill="#24292f" text-anchor="middle">Vector · 1차원</text>
    <rect x="30" y="96" width="44" height="44" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="78" y="96" width="44" height="44" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="126" y="96" width="44" height="44" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="52" y="124" font-size="15" font-weight="700" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">1</text>
    <text x="100" y="124" font-size="15" font-weight="700" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">2</text>
    <text x="148" y="124" font-size="15" font-weight="700" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">3</text>
    <text x="100" y="200" font-size="12" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">torch.tensor([1, 2, 3])</text>
    <text x="100" y="222" font-size="12.5" fill="#0969da" text-anchor="middle" font-family="ui-monospace, monospace">shape: torch.Size([3])</text>
  </g>

  <!-- Panel 3: Matrix -->
  <g transform="translate(500,20)">
    <text x="100" y="16" font-size="15" font-weight="700" fill="#24292f" text-anchor="middle">Matrix · 2차원</text>
    <rect x="36" y="76" width="40" height="40" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="80" y="76" width="40" height="40" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="124" y="76" width="40" height="40" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="36" y="120" width="40" height="40" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="80" y="120" width="40" height="40" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="124" y="120" width="40" height="40" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="56" y="101" font-size="14" font-weight="700" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">1</text>
    <text x="100" y="101" font-size="14" font-weight="700" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">2</text>
    <text x="144" y="101" font-size="14" font-weight="700" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">3</text>
    <text x="56" y="145" font-size="14" font-weight="700" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">4</text>
    <text x="100" y="145" font-size="14" font-weight="700" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">5</text>
    <text x="144" y="145" font-size="14" font-weight="700" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">6</text>
    <text x="100" y="200" font-size="12" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">2행 3열</text>
    <text x="100" y="222" font-size="12.5" fill="#0969da" text-anchor="middle" font-family="ui-monospace, monospace">shape: torch.Size([2, 3])</text>
  </g>

  <!-- Panel 4: 3D Tensor -->
  <g transform="translate(740,20)">
    <text x="100" y="16" font-size="15" font-weight="700" fill="#24292f" text-anchor="middle">3D Tensor · 3차원</text>

    <!-- back matrix (7-12), drawn first so the front matrix overlaps it -->
    <g transform="translate(20,-16)">
      <rect x="30" y="90" width="36" height="36" rx="4" fill="#e8ebef" stroke="#c7cdd4" stroke-width="1.3"/>
      <rect x="69" y="90" width="36" height="36" rx="4" fill="#e8ebef" stroke="#c7cdd4" stroke-width="1.3"/>
      <rect x="108" y="90" width="36" height="36" rx="4" fill="#e8ebef" stroke="#c7cdd4" stroke-width="1.3"/>
      <rect x="30" y="129" width="36" height="36" rx="4" fill="#e8ebef" stroke="#c7cdd4" stroke-width="1.3"/>
      <rect x="69" y="129" width="36" height="36" rx="4" fill="#e8ebef" stroke="#c7cdd4" stroke-width="1.3"/>
      <rect x="108" y="129" width="36" height="36" rx="4" fill="#e8ebef" stroke="#c7cdd4" stroke-width="1.3"/>
      <text x="48" y="113" font-size="12.5" font-weight="700" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">7</text>
      <text x="87" y="113" font-size="12.5" font-weight="700" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">8</text>
      <text x="126" y="113" font-size="12.5" font-weight="700" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">9</text>
      <text x="48" y="152" font-size="12.5" font-weight="700" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">10</text>
      <text x="87" y="152" font-size="12.5" font-weight="700" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">11</text>
      <text x="126" y="152" font-size="12.5" font-weight="700" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">12</text>
    </g>

    <!-- front matrix (1-6) -->
    <rect x="30" y="90" width="36" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="69" y="90" width="36" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="108" y="90" width="36" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="30" y="129" width="36" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="69" y="129" width="36" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="108" y="129" width="36" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="48" y="113" font-size="13" font-weight="700" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">1</text>
    <text x="87" y="113" font-size="13" font-weight="700" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">2</text>
    <text x="126" y="113" font-size="13" font-weight="700" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">3</text>
    <text x="48" y="152" font-size="13" font-weight="700" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">4</text>
    <text x="87" y="152" font-size="13" font-weight="700" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">5</text>
    <text x="126" y="152" font-size="13" font-weight="700" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">6</text>

    <text x="100" y="200" font-size="12" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">2×3 행렬 2개</text>
    <text x="100" y="222" font-size="12.5" fill="#0969da" text-anchor="middle" font-family="ui-monospace, monospace">shape: torch.Size([2, 2, 3])</text>
  </g>
</svg>
