<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img" aria-labelledby="title desc"><title id="title">개인정보 보호는 전송 경로마다</title><desc id="desc">입력 개인정보 제거 → 모델 API 보호; 로그 마스킹 → Langfuse 보호; 응답 개인정보 점검 → 사용자 표시 전</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#647674"/></marker></defs><rect width="680" height="520" rx="20" fill="#f5f4ef"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="32" y="52" font-size="30" font-weight="700" fill="#233a3b" text-anchor="start">개인정보 보호는 전송 경로마다</text><rect x="30" y="95" width="264" height="86" rx="14" fill="#e4f2ec"/><rect x="386" y="95" width="264" height="86" rx="14" fill="#e4f2ec"/><path d="M302 138 H374" stroke="#647674" stroke-width="3" marker-end="url(#arrow)"/><text x="162" y="148" font-size="29" font-weight="700" fill="#233a3b" text-anchor="middle">입력 개인정보 제거</text><text x="518" y="148" font-size="29" font-weight="700" fill="#233a3b" text-anchor="middle">모델 API 보호</text><rect x="30" y="215" width="264" height="86" rx="14" fill="#eaf1fc"/><rect x="386" y="215" width="264" height="86" rx="14" fill="#eaf1fc"/><path d="M302 258 H374" stroke="#647674" stroke-width="3" marker-end="url(#arrow)"/><text x="162" y="268" font-size="29" font-weight="700" fill="#233a3b" text-anchor="middle">로그 마스킹</text><text x="518" y="268" font-size="29" font-weight="700" fill="#233a3b" text-anchor="middle">Langfuse 보호</text><rect x="30" y="335" width="264" height="86" rx="14" fill="#f0ebf8"/><rect x="386" y="335" width="264" height="86" rx="14" fill="#f0ebf8"/><path d="M302 378 H374" stroke="#647674" stroke-width="3" marker-end="url(#arrow)"/><text x="162" y="388" font-size="29" font-weight="700" fill="#233a3b" text-anchor="middle">응답 개인정보 점검</text><text x="518" y="388" font-size="29" font-weight="700" fill="#233a3b" text-anchor="middle">사용자 표시 전</text><text x="340" y="490" font-size="25" font-weight="400" fill="#526664" text-anchor="middle">한 경로의 처리가 다른 경로를 대신하지 않음</text></g></svg>

