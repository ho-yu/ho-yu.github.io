<svg xmlns="http://www.w3.org/2000/svg" width="680" height="584" viewBox="0 0 680 584" role="img" aria-labelledby="title desc"><title id="title">Langfuse 마스킹의 역할 분담</title><desc id="desc">redact: 문자열의 이메일을 치환 → OtelSpanPatch: 바뀐 속성만 변경 명세로 묶기 → Langfuse SDK: 내보내기 전에 변경 내용 적용</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#647674"/></marker></defs><rect width="680" height="584" rx="20" fill="#f5f4ef"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="32" y="52" font-size="30" font-weight="700" fill="#233a3b" text-anchor="start">Langfuse 마스킹의 역할 분담</text><rect x="34" y="90" width="612" height="108" rx="16" fill="#e4f2ec"/><text x="340" y="133" font-size="30" font-weight="700" fill="#233a3b" text-anchor="middle">redact</text><text x="340" y="172" font-size="26" font-weight="400" fill="#526664" text-anchor="middle">문자열의 이메일을 치환</text><path d="M340 206 V224" stroke="#647674" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="233" width="612" height="108" rx="16" fill="#eaf1fc"/><text x="340" y="276" font-size="30" font-weight="700" fill="#233a3b" text-anchor="middle">OtelSpanPatch</text><text x="340" y="315" font-size="26" font-weight="400" fill="#526664" text-anchor="middle">바뀐 속성만 변경 명세로 묶기</text><path d="M340 349 V367" stroke="#647674" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="376" width="612" height="108" rx="16" fill="#f0ebf8"/><text x="340" y="419" font-size="30" font-weight="700" fill="#233a3b" text-anchor="middle">Langfuse SDK</text><text x="340" y="458" font-size="26" font-weight="400" fill="#526664" text-anchor="middle">내보내기 전에 변경 내용 적용</text><text x="340" y="554" font-size="25" font-weight="400" fill="#526664" text-anchor="middle">span 이름·이벤트·다른 exporter는 별도 검토</text></g></svg>

