<svg xmlns="http://www.w3.org/2000/svg" width="680" height="727" viewBox="0 0 680 727" role="img" aria-labelledby="title desc"><title id="title">도구 제안에서 실제 실행까지</title><desc id="desc">모델의 도구 호출 제안: 도구 이름과 인자 → 허용 목록·인자 검사: 실행 코드에서 형식과 대상 확인 → 접근 권한·필요한 승인: 자원 권한과 승인 조건 각각 확인 → 통과한 행동만 실행: 실패하면 실행 중단</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#647674"/></marker></defs><rect width="680" height="727" rx="20" fill="#f5f4ef"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="32" y="52" font-size="30" font-weight="700" fill="#233a3b" text-anchor="start">도구 제안에서 실제 실행까지</text><rect x="34" y="90" width="612" height="108" rx="16" fill="#e4f2ec"/><text x="340" y="133" font-size="30" font-weight="700" fill="#233a3b" text-anchor="middle">모델의 도구 호출 제안</text><text x="340" y="172" font-size="26" font-weight="400" fill="#526664" text-anchor="middle">도구 이름과 인자</text><path d="M340 206 V224" stroke="#647674" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="233" width="612" height="108" rx="16" fill="#eaf1fc"/><text x="340" y="276" font-size="30" font-weight="700" fill="#233a3b" text-anchor="middle">허용 목록·인자 검사</text><text x="340" y="315" font-size="26" font-weight="400" fill="#526664" text-anchor="middle">실행 코드에서 형식과 대상 확인</text><path d="M340 349 V367" stroke="#647674" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="376" width="612" height="108" rx="16" fill="#f0ebf8"/><text x="340" y="419" font-size="30" font-weight="700" fill="#233a3b" text-anchor="middle">접근 권한·필요한 승인</text><text x="340" y="458" font-size="26" font-weight="400" fill="#526664" text-anchor="middle">자원 권한과 승인 조건 각각 확인</text><path d="M340 492 V510" stroke="#647674" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="519" width="612" height="108" rx="16" fill="#fff0dd"/><text x="340" y="562" font-size="30" font-weight="700" fill="#233a3b" text-anchor="middle">통과한 행동만 실행</text><text x="340" y="601" font-size="26" font-weight="400" fill="#526664" text-anchor="middle">실패하면 실행 중단</text><text x="340" y="697" font-size="25" font-weight="400" fill="#526664" text-anchor="middle">메일 전송·파일 조회처럼 실제 행동을 할 때</text></g></svg>

