<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-labelledby="title desc"><title id="title">프롬프트 인젝션이 들어오는 경로</title><desc id="desc">직접 주입 → 사용자 질문; 간접 주입 → 문서·웹·도구 결과</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#647674"/></marker></defs><rect width="680" height="400" rx="20" fill="#f5f4ef"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="32" y="52" font-size="30" font-weight="700" fill="#233a3b" text-anchor="start">프롬프트 인젝션이 들어오는 경로</text><rect x="30" y="95" width="264" height="86" rx="14" fill="#e4f2ec"/><rect x="386" y="95" width="264" height="86" rx="14" fill="#e4f2ec"/><path d="M302 138 H374" stroke="#647674" stroke-width="3" marker-end="url(#arrow)"/><text x="162" y="148" font-size="29" font-weight="700" fill="#233a3b" text-anchor="middle">직접 주입</text><text x="518" y="148" font-size="29" font-weight="700" fill="#233a3b" text-anchor="middle">사용자 질문</text><rect x="30" y="215" width="264" height="86" rx="14" fill="#eaf1fc"/><rect x="386" y="215" width="264" height="86" rx="14" fill="#eaf1fc"/><path d="M302 258 H374" stroke="#647674" stroke-width="3" marker-end="url(#arrow)"/><text x="162" y="268" font-size="29" font-weight="700" fill="#233a3b" text-anchor="middle">간접 주입</text><text x="518" y="268" font-size="29" font-weight="700" fill="#233a3b" text-anchor="middle">문서·웹·도구 결과</text><text x="340" y="370" font-size="25" font-weight="400" fill="#526664" text-anchor="middle">공격 차단과 정상 요청의 기대 행동을 함께 평가</text></g></svg>

