<svg xmlns="http://www.w3.org/2000/svg" width="680" height="584" viewBox="0 0 680 584" role="img" aria-labelledby="title desc"><title id="title">출력 검증의 범위</title><desc id="desc">구문·타입: JSON·필수 필드·자료형 → 필드 사이의 관계: 서비스가 정한 업무 규칙 → 이번 요청의 출처 범위: 실제 제공한 문서 안에서 인용</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#647674"/></marker></defs><rect width="680" height="584" rx="20" fill="#f5f4ef"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="32" y="52" font-size="30" font-weight="700" fill="#233a3b" text-anchor="start">출력 검증의 범위</text><rect x="34" y="90" width="612" height="108" rx="16" fill="#e4f2ec"/><text x="340" y="133" font-size="30" font-weight="700" fill="#233a3b" text-anchor="middle">구문·타입</text><text x="340" y="172" font-size="26" font-weight="400" fill="#526664" text-anchor="middle">JSON·필수 필드·자료형</text><path d="M340 206 V224" stroke="#647674" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="233" width="612" height="108" rx="16" fill="#eaf1fc"/><text x="340" y="276" font-size="30" font-weight="700" fill="#233a3b" text-anchor="middle">필드 사이의 관계</text><text x="340" y="315" font-size="26" font-weight="400" fill="#526664" text-anchor="middle">서비스가 정한 업무 규칙</text><path d="M340 349 V367" stroke="#647674" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="376" width="612" height="108" rx="16" fill="#f0ebf8"/><text x="340" y="419" font-size="30" font-weight="700" fill="#233a3b" text-anchor="middle">이번 요청의 출처 범위</text><text x="340" y="458" font-size="26" font-weight="400" fill="#526664" text-anchor="middle">실제 제공한 문서 안에서 인용</text><text x="340" y="554" font-size="25" font-weight="400" fill="#526664" text-anchor="middle">사실 정확성은 근거 원문과 별도로 대조</text></g></svg>

