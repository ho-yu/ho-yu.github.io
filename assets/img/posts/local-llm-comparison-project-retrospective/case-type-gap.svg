<svg width="720" height="260" viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="720" height="260" fill="#f6f8fa" rx="10"/>
  <text x="360" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-weight="700">모델 간 품질 격차 — 사례 유형별</text>

  <line x1="170" y1="60" x2="170" y2="210" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="295" y1="60" x2="295" y2="210" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="420" y1="60" x2="420" y2="210" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="545" y1="60" x2="545" y2="210" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="670" y1="60" x2="670" y2="210" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="170" y="228" font-size="10.5" fill="#57606a" text-anchor="middle">0%</text>
  <text x="295" y="228" font-size="10.5" fill="#57606a" text-anchor="middle">25%</text>
  <text x="420" y="228" font-size="10.5" fill="#57606a" text-anchor="middle">50%</text>
  <text x="545" y="228" font-size="10.5" fill="#57606a" text-anchor="middle">75%</text>
  <text x="670" y="228" font-size="10.5" fill="#57606a" text-anchor="middle">100%</text>

  <text x="160" y="103" font-size="12.5" fill="#24292f" text-anchor="end" font-weight="700">정상 문의</text>
  <rect x="170" y="80" width="48.5" height="36" rx="4" fill="#0969da" fill-opacity="0.22" stroke="#0969da" stroke-width="1.6"/>
  <text x="226.5" y="103" font-size="12.5" fill="#0969da" text-anchor="start" font-weight="700">9.7%</text>

  <text x="160" y="173" font-size="12.5" fill="#24292f" text-anchor="end" font-weight="700">정보 부족 문의</text>
  <rect x="170" y="150" width="422" height="36" rx="4" fill="#cf222e" fill-opacity="0.22" stroke="#cf222e" stroke-width="1.6"/>
  <text x="600" y="173" font-size="12.5" fill="#cf222e" text-anchor="start" font-weight="700">84.4%</text>

  <text x="360" y="248" font-size="11.5" fill="#24292f" text-anchor="middle" font-weight="700">같은 모델이라도 사례 유형에 따라 격차가 크게 달라진다.</text>
</svg>
