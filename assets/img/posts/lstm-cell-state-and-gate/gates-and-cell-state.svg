<svg width="720" height="288" viewBox="0 0 720 288" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="720" height="288" fill="#f6f8fa" rx="10"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6.4" refY="3" orient="auto"><path d="M0,0 L6.4,3 L0,6 z" fill="#57606a"/></marker>
  <marker id="ao" markerWidth="8" markerHeight="8" refX="6.4" refY="3" orient="auto"><path d="M0,0 L6.4,3 L0,6 z" fill="#9a6700"/></marker></defs>
  <text x="360" y="26" font-size="14" fill="#24292f" text-anchor="middle" font-weight="700">Gate가 Cell State에서 버릴 정보와 더할 정보를 정한다</text>
  <text x="30" y="52" font-size="11" fill="#0969da" text-anchor="start" font-weight="700">Cell State — 여러 시점을 거치며 장기적으로 유지되는 메모리</text>
  <rect x="30" y="62" width="86" height="56" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.6"/>
  <text x="73.0" y="85" font-size="12" fill="#57606a" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">C(t-1)</text>
  <line x1="118" y1="90" x2="138" y2="90" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="142" y="62" width="180" height="56" rx="6" fill="#fceceb" stroke="#cf222e" stroke-width="1.6"/>
  <text x="232.0" y="85" font-size="12" fill="#cf222e" text-anchor="middle" font-weight="700">Forget Gate</text>
  <text x="232.0" y="103" font-size="10.5" fill="#57606a" text-anchor="middle">필요 없는 정보 제거</text>
  <line x1="324" y1="90" x2="344" y2="90" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="348" y="62" width="180" height="56" rx="6" fill="#eaf6ec" stroke="#1a7f37" stroke-width="1.6"/>
  <text x="438.0" y="85" font-size="12" fill="#1a7f37" text-anchor="middle" font-weight="700">Input Gate</text>
  <text x="438.0" y="103" font-size="10.5" fill="#57606a" text-anchor="middle">현재 정보 중 필요한 정보 추가</text>
  <line x1="530" y1="90" x2="550" y2="90" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="554" y="62" width="86" height="56" rx="6" fill="#eaf2fb" stroke="#0969da" stroke-width="1.6"/>
  <text x="597.0" y="85" font-size="12" fill="#0969da" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">C(t)</text>
  <text x="597" y="134" font-size="10.5" fill="#57606a" text-anchor="middle">→ 다음 시점으로 전달</text>
  <line x1="30" y1="152" x2="690" y2="152" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="30" y="176" font-size="11" fill="#8250df" text-anchor="start" font-weight="700">Hidden State — 현재 시점에서 사용할 정보</text>
  <rect x="142" y="186" width="180" height="56" rx="6" fill="#f3eefc" stroke="#8250df" stroke-width="1.6"/>
  <text x="232.0" y="209" font-size="12" fill="#8250df" text-anchor="middle" font-weight="700">Output Gate</text>
  <text x="232.0" y="227" font-size="10.5" fill="#57606a" text-anchor="middle">현재 시점에서 사용할 정보 결정</text>
  <line x1="324" y1="214" x2="344" y2="214" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="348" y="186" width="86" height="56" rx="6" fill="#f3eefc" stroke="#8250df" stroke-width="1.6"/>
  <text x="391.0" y="209" font-size="12" fill="#8250df" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">h(t)</text>
  <text x="560" y="218" font-size="10.5" fill="#57606a" text-anchor="middle">현재 시점의 출력 / 단기 정보</text>
  <text x="360" y="272" font-size="11" fill="#57606a" text-anchor="middle">Cell State는 장기적으로 전달되는 메모리이고, Gate가 무엇을 버리고 더할지를 제어한다</text>
</svg>
