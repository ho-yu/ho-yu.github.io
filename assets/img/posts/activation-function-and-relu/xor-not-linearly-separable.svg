<svg width="420" height="350" viewBox="0 0 420 350" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ax2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="420" height="350" fill="#f6f8fa" rx="10"/>
  <text x="210" y="22" font-size="14.5" font-weight="700" fill="#24292f" text-anchor="middle">XOR — 한 직선으로는 두 class를 나눌 수 없다</text>

  <!-- axes: origin at (70,260), x=1 at (270,260), y=1 at (70,60) -->
  <line x1="70" y1="260" x2="310" y2="260" stroke="#57606a" stroke-width="1.5" marker-end="url(#ax2)"/>
  <line x1="70" y1="260" x2="70" y2="30" stroke="#57606a" stroke-width="1.5" marker-end="url(#ax2)"/>
  <text x="306" y="278" font-size="13" fill="#57606a" font-family="ui-monospace, monospace" text-anchor="end">x&#8321;</text>
  <text x="54" y="38" font-size="13" fill="#57606a" font-family="ui-monospace, monospace">x&#8322;</text>

  <!-- tick labels 0 / 1 -->
  <text x="70" y="278" font-size="12" fill="#57606a" font-family="ui-monospace, monospace" text-anchor="middle">0</text>
  <text x="270" y="278" font-size="12" fill="#57606a" font-family="ui-monospace, monospace" text-anchor="middle">1</text>
  <text x="54" y="264" font-size="12" fill="#57606a" font-family="ui-monospace, monospace" text-anchor="end">0</text>
  <text x="54" y="64" font-size="12" fill="#57606a" font-family="ui-monospace, monospace" text-anchor="end">1</text>

  <!-- dashed guide lines to the 4 points -->
  <line x1="70" y1="60" x2="270" y2="60" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="270" y1="260" x2="270" y2="60" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- points: (0,0)=class0, (1,1)=class0, (0,1)=class1, (1,0)=class1 -->
  <!-- class 0 : x1 XOR x2 = 0 -->
  <circle cx="70" cy="260" r="9" fill="#1d4ed8"/>
  <text x="70" y="286" font-size="11.5" fill="#1d4ed8" text-anchor="middle" font-family="ui-monospace, monospace">(0,0)&#8594;0</text>

  <circle cx="270" cy="60" r="9" fill="#1d4ed8"/>
  <text x="270" y="46" font-size="11.5" fill="#1d4ed8" text-anchor="middle" font-family="ui-monospace, monospace">(1,1)&#8594;0</text>

  <!-- class 1 : x1 XOR x2 = 1 -->
  <circle cx="270" cy="260" r="9" fill="#b45309"/>
  <text x="270" y="286" font-size="11.5" fill="#b45309" text-anchor="middle" font-family="ui-monospace, monospace">(1,0)&#8594;1</text>

  <circle cx="70" cy="60" r="9" fill="#b45309"/>
  <text x="70" y="46" font-size="11.5" fill="#b45309" text-anchor="middle" font-family="ui-monospace, monospace">(0,1)&#8594;1</text>

  <!-- an example straight line that fails to separate them -->
  <line x1="45" y1="230" x2="300" y2="90" stroke="#cf222e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="330" y="90" font-size="11" fill="#cf222e" text-anchor="start">시도한 직선</text>

  <!-- legend -->
  <circle cx="150" cy="312" r="6" fill="#1d4ed8"/>
  <text x="160" y="316" font-size="12" fill="#24292f">class 0</text>
  <circle cx="230" cy="312" r="6" fill="#b45309"/>
  <text x="240" y="316" font-size="12" fill="#24292f">class 1</text>

  <text x="210" y="338" font-size="11" fill="#57606a" text-anchor="middle">어떤 직선을 그어도 class 0 두 점과 class 1 두 점을 동시에 나눌 수 없다</text>
</svg>
