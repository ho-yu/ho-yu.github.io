<svg width="720" height="350" viewBox="0 0 720 350" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="720" height="350" fill="#f6f8fa" rx="10"/>
  <text x="360.0" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-weight="700">모델 이름은 여러 관점이 이어 붙은 것</text>
  <rect x="144.0" y="50" width="88" height="34" rx="5" fill="#ffffff" stroke="#0969da" stroke-width="1.8"/>
  <text x="188.0" y="71.68" font-size="13" fill="#0969da" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">Llama</text>
  <rect x="240.0" y="50" width="58" height="34" rx="5" fill="#ffffff" stroke="#57606a" stroke-width="1.8"/>
  <text x="269.0" y="71.68" font-size="13" fill="#57606a" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">3.1</text>
  <rect x="306.0" y="50" width="54" height="34" rx="5" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8"/>
  <text x="333.0" y="71.68" font-size="13" fill="#1a7f37" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">8B</text>
  <rect x="368.0" y="50" width="96" height="34" rx="5" fill="#ffffff" stroke="#8250df" stroke-width="1.8"/>
  <text x="416.0" y="71.68" font-size="13" fill="#8250df" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">Instruct</text>
  <rect x="472.0" y="50" width="104" height="34" rx="5" fill="#ffffff" stroke="#9a6700" stroke-width="1.8"/>
  <text x="524.0" y="71.68" font-size="13" fill="#9a6700" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">Q4_K_M</text>
  <text x="360.0" y="100" font-size="11" fill="#57606a" text-anchor="middle" font-weight="400">위 이름 하나에 아래 다섯 가지 관점이 들어 있다</text>
  <rect x="40" y="116" width="640" height="36" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="40" y="116" width="5" height="36" rx="2" fill="#0969da" stroke="#0969da" stroke-width="0"/>
  <text x="64" y="139" font-size="12.5" fill="#0969da" text-anchor="start" font-weight="700" font-family="ui-monospace, monospace">Llama</text>
  <text x="196" y="139" font-size="12" fill="#24292f" text-anchor="start" font-weight="700">계열(Family)</text>
  <text x="384" y="139" font-size="11.5" fill="#57606a" text-anchor="start" font-weight="400">Meta가 개발한 모델 계열</text>
  <rect x="40" y="160" width="640" height="36" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="40" y="160" width="5" height="36" rx="2" fill="#57606a" stroke="#57606a" stroke-width="0"/>
  <text x="64" y="183" font-size="12.5" fill="#57606a" text-anchor="start" font-weight="700" font-family="ui-monospace, monospace">3.1</text>
  <text x="196" y="183" font-size="12" fill="#24292f" text-anchor="start" font-weight="700">세대 / 버전</text>
  <text x="384" y="183" font-size="11.5" fill="#57606a" text-anchor="start" font-weight="400">뒤의 숫자는 보통 모델의 세대나 버전을 의미</text>
  <rect x="40" y="204" width="640" height="36" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="40" y="204" width="5" height="36" rx="2" fill="#1a7f37" stroke="#1a7f37" stroke-width="0"/>
  <text x="64" y="227" font-size="12.5" fill="#1a7f37" text-anchor="start" font-weight="700" font-family="ui-monospace, monospace">8B</text>
  <text x="196" y="227" font-size="12" fill="#24292f" text-anchor="start" font-weight="700">크기(Parameter)</text>
  <text x="384" y="227" font-size="11.5" fill="#57606a" text-anchor="start" font-weight="400">약 80억 개 파라미터</text>
  <rect x="40" y="248" width="640" height="36" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="40" y="248" width="5" height="36" rx="2" fill="#8250df" stroke="#8250df" stroke-width="0"/>
  <text x="64" y="271" font-size="12.5" fill="#8250df" text-anchor="start" font-weight="700" font-family="ui-monospace, monospace">Instruct</text>
  <text x="196" y="271" font-size="12" fill="#24292f" text-anchor="start" font-weight="700">학습 형태</text>
  <text x="384" y="271" font-size="11.5" fill="#57606a" text-anchor="start" font-weight="400">사람의 지시를 따르도록 추가 학습한 모델</text>
  <rect x="40" y="292" width="640" height="36" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="40" y="292" width="5" height="36" rx="2" fill="#9a6700" stroke="#9a6700" stroke-width="0"/>
  <text x="64" y="315" font-size="12.5" fill="#9a6700" text-anchor="start" font-weight="700" font-family="ui-monospace, monospace">Q4_K_M</text>
  <text x="196" y="315" font-size="12" fill="#24292f" text-anchor="start" font-weight="700">실행 방식(Quantization)</text>
  <text x="384" y="315" font-size="11.5" fill="#57606a" text-anchor="start" font-weight="400">어떤 형태로 압축해서 실행하는가</text>
</svg>
