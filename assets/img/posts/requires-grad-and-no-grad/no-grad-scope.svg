<svg width="620" height="210" viewBox="0 0 620 210" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="620" height="210" fill="#f6f8fa" rx="10"/>
  <defs>
    <marker id="a-57606a" markerWidth="8" markerHeight="8" refX="6.4" refY="3" orient="auto"><path d="M0,0 L6.4,3 L0,6 z" fill="#57606a"/></marker>
    <marker id="a-1a7f37" markerWidth="8" markerHeight="8" refX="6.4" refY="3" orient="auto"><path d="M0,0 L6.4,3 L0,6 z" fill="#1a7f37"/></marker>
    <marker id="a-cf222e" markerWidth="8" markerHeight="8" refX="6.4" refY="3" orient="auto"><path d="M0,0 L6.4,3 L0,6 z" fill="#cf222e"/></marker>
  </defs>
  <text x="310.0" y="26.0" font-size="14" fill="#24292f" text-anchor="middle" font-weight="700">no_grad()는 블록 안에서만 끈다</text>
  <rect x="40" y="74" width="150" height="46" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8"/>
  <text x="115.0" y="93.0" font-size="11" fill="#57606a" text-anchor="middle" font-weight="600">평소</text>
  <text x="115.0" y="110.0" font-size="12" fill="#1a7f37" text-anchor="middle" font-weight="700">추적 ON</text>
  <rect x="190" y="74" width="220" height="46" rx="6" fill="#ffffff" stroke="#cf222e" stroke-width="1.8"/>
  <text x="300.0" y="93.0" font-size="11" fill="#57606a" text-anchor="middle" font-weight="600" font-family="ui-monospace, monospace">with torch.no_grad():</text>
  <text x="300.0" y="110.0" font-size="12" fill="#cf222e" text-anchor="middle" font-weight="700">추적 OFF</text>
  <rect x="438" y="74" width="142" height="46" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8"/>
  <text x="509.0" y="93.0" font-size="11" fill="#57606a" text-anchor="middle" font-weight="600">블록 종료</text>
  <text x="509.0" y="110.0" font-size="12" fill="#1a7f37" text-anchor="middle" font-weight="700">추적 ON</text>
  <line x1="150.0" y1="97.0" x2="188.0" y2="97.0" stroke="#57606a" stroke-width="1.8" marker-end="url(#a-57606a)"/>
  <line x1="410.0" y1="97.0" x2="436.0" y2="97.0" stroke="#57606a" stroke-width="1.8" marker-end="url(#a-57606a)"/>
  <rect x="40" y="146" width="540" height="40" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60.0" y="171.0" font-size="11" fill="#57606a" text-anchor="start" font-weight="600" font-family="ui-monospace, monospace">model.weight.requires_grad</text>
  <text x="266.0" y="171.0" font-size="12" fill="#57606a" text-anchor="start" font-weight="400">→</text>
  <text x="292.0" y="171.0" font-size="11.5" fill="#1a7f37" text-anchor="start" font-weight="700" font-family="ui-monospace, monospace">True</text>
  <text x="340.0" y="171.0" font-size="11" fill="#57606a" text-anchor="start" font-weight="400">블록 안에서도, 블록이 끝난 뒤에도 그대로 True</text>
</svg>
