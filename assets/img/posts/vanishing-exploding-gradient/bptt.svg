<svg width="720" height="210" viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="720" height="210" fill="#f6f8fa" rx="10"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6.4" refY="3" orient="auto"><path d="M0,0 L6.4,3 L0,6 z" fill="#57606a"/></marker>
  <marker id="ao" markerWidth="8" markerHeight="8" refX="6.4" refY="3" orient="auto"><path d="M0,0 L6.4,3 L0,6 z" fill="#9a6700"/></marker></defs>
  <text x="360" y="26" font-size="14" fill="#24292f" text-anchor="middle" font-weight="700">RNN은 역전파도 시간축을 거꾸로 거슬러 올라간다</text>
  <rect x="60" y="70" width="80" height="44" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
  <text x="100" y="98" font-size="13" fill="#0969da" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">h1</text>
  <line x1="142" y1="92" x2="162" y2="92" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="164" y="70" width="80" height="44" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
  <text x="204" y="98" font-size="13" fill="#0969da" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">h2</text>
  <line x1="246" y1="92" x2="266" y2="92" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="268" y="70" width="80" height="44" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
  <text x="308" y="98" font-size="13" fill="#0969da" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">h3</text>
  <line x1="350" y1="92" x2="370" y2="92" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="372" y="70" width="80" height="44" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
  <text x="412" y="98" font-size="13" fill="#0969da" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">h4</text>
  <line x1="454" y1="92" x2="474" y2="92" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="476" y="70" width="80" height="44" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
  <text x="516" y="98" font-size="13" fill="#0969da" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">h5</text>
  <line x1="558" y1="92" x2="578" y2="92" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="580" y="70" width="80" height="44" rx="6" fill="#fdf3e3" stroke="#9a6700" stroke-width="1.6"/>
  <text x="620" y="98" font-size="13" fill="#9a6700" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">Loss</text>
  <text x="360" y="142" font-size="11.5" fill="#8250df" text-anchor="middle" font-weight="700">역전파 — 시간축을 거꾸로 거슬러 올라가며 Gradient를 반복 계산</text>
  <line x1="630" y1="158" x2="90" y2="158" stroke="#8250df" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="360" y="192" font-size="11.5" fill="#57606a" text-anchor="middle">이 반복 과정에서 Gradient가 지나치게 작아지거나(경사 소실) 커질(경사 폭발) 수 있다</text>
