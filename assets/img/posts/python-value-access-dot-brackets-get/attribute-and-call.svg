<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img" aria-labelledby="title desc">
<title id="title">속성 읽기와 메서드 호출</title><desc id="desc">Path 객체의 name은 파일명을 반환하고 exists 메서드는 괄호로 호출하여 경로 존재 여부를 확인한다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#177B72"/></marker></defs>
<rect width="680" height="600" rx="24" fill="#F5F4EF"/>
<text x="38" y="55" font-family="Malgun Gothic, sans-serif" font-size="34" fill="#243C3E" font-weight="700" text-anchor="start">속성 읽기와 메서드 호출</text><text x="38" y="106" font-family="Consolas, monospace" font-size="27" fill="#243C3E" font-weight="400" text-anchor="start">file_path = Path(&quot;sales.csv&quot;)</text><rect x="30" y="146" width="620" height="158" rx="18" fill="#E4F2EC"/><text x="54" y="191" font-family="Malgun Gothic, sans-serif" font-size="28" fill="#243C3E" font-weight="700" text-anchor="start">속성값 읽기</text><text x="54" y="239" font-family="Consolas, monospace" font-size="31" fill="#243C3E" font-weight="400" text-anchor="start">file_path.name</text><path d="M356,230 L403,230" fill="none" stroke="#177B72" stroke-width="3" marker-end="url(#arrow)"/><text x="430" y="239" font-family="Consolas, monospace" font-size="30" fill="#243C3E" font-weight="400" text-anchor="start">sales.csv</text><rect x="30" y="334" width="620" height="216" rx="18" fill="#EAF1FC"/><text x="54" y="380" font-family="Malgun Gothic, sans-serif" font-size="28" fill="#243C3E" font-weight="700" text-anchor="start">메서드 찾기 + 호출하기</text><text x="54" y="430" font-family="Consolas, monospace" font-size="31" fill="#243C3E" font-weight="400" text-anchor="start">file_path.exists()</text><text x="54" y="481" font-family="Malgun Gothic, sans-serif" font-size="27" fill="#243C3E" font-weight="400" text-anchor="start">exists 메서드</text><path d="M284,472 L350,472" fill="none" stroke="#177B72" stroke-width="3" marker-end="url(#arrow)"/><text x="378" y="481" font-family="Malgun Gothic, sans-serif" font-size="27" fill="#243C3E" font-weight="400" text-anchor="start">()로 호출</text><text x="54" y="525" font-family="Malgun Gothic, sans-serif" font-size="25" fill="#243C3E" font-weight="400" text-anchor="start">결과: True 또는 False · 경로 확인 결과</text><text x="340" y="580" font-family="Malgun Gothic, sans-serif" font-size="25" fill="#243C3E" font-weight="400" text-anchor="middle">객체가 제공하는 이름을 .으로 찾는다</text>
</svg>