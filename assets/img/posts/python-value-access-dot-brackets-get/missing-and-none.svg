<svg xmlns="http://www.w3.org/2000/svg" width="680" height="710" viewBox="0 0 680 710" role="img" aria-labelledby="title desc">
<title id="title">키 누락과 None 비교</title><desc id="desc">값이 경비실이면 두 접근 모두 경비실, 값이 None이면 둘 다 None이다. 키가 없을 때만 대괄호는 KeyError, get은 지정한 기본값을 반환한다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#177B72"/></marker></defs>
<rect width="680" height="710" rx="24" fill="#F5F4EF"/>
<text x="38" y="55" font-family="Malgun Gothic, sans-serif" font-size="32" fill="#243C3E" font-weight="700" text-anchor="start">get의 기본값은 언제 쓰일까?</text><text x="38" y="103" font-family="Malgun Gothic, sans-serif" font-size="27" fill="#243C3E" font-weight="400" text-anchor="start">배송 요청사항을 조회하는 예시</text><text x="144" y="162" font-family="Malgun Gothic, sans-serif" font-size="27" fill="#243C3E" font-weight="700" text-anchor="middle">저장 상태</text><text x="355" y="162" font-family="Consolas, monospace" font-size="28" fill="#243C3E" font-weight="700" text-anchor="middle">[&quot;키&quot;]</text><text x="557" y="162" font-family="Consolas, monospace" font-size="28" fill="#243C3E" font-weight="700" text-anchor="middle">.get(...)</text><rect x="24" y="190" width="632" height="104" rx="18" fill="#E4F2EC"/><text x="144" y="252" font-family="Malgun Gothic, sans-serif" font-size="28" fill="#243C3E" font-weight="400" text-anchor="middle">값: 경비실</text><text x="355" y="252" font-family="Malgun Gothic, sans-serif" font-size="29" fill="#243C3E" font-weight="400" text-anchor="middle">경비실</text><text x="557" y="252" font-family="Malgun Gothic, sans-serif" font-size="28" fill="#243C3E" font-weight="400" text-anchor="middle">경비실</text><rect x="24" y="313" width="632" height="104" rx="18" fill="#EAF1FC"/><text x="144" y="375" font-family="Malgun Gothic, sans-serif" font-size="28" fill="#243C3E" font-weight="400" text-anchor="middle">값: None</text><text x="355" y="375" font-family="Malgun Gothic, sans-serif" font-size="29" fill="#243C3E" font-weight="400" text-anchor="middle">None</text><text x="557" y="375" font-family="Malgun Gothic, sans-serif" font-size="28" fill="#243C3E" font-weight="400" text-anchor="middle">None</text><rect x="24" y="436" width="632" height="104" rx="18" fill="#FFF0DD"/><text x="144" y="498" font-family="Malgun Gothic, sans-serif" font-size="28" fill="#243C3E" font-weight="400" text-anchor="middle">키 없음</text><text x="355" y="498" font-family="Malgun Gothic, sans-serif" font-size="29" fill="#243C3E" font-weight="400" text-anchor="middle">KeyError</text><text x="557" y="498" font-family="Malgun Gothic, sans-serif" font-size="28" fill="#243C3E" font-weight="400" text-anchor="middle">요청 없음</text><text x="340" y="591" font-family="Malgun Gothic, sans-serif" font-size="29" fill="#243C3E" font-weight="400" text-anchor="middle">기본값 = &quot;요청 없음&quot;</text><text x="340" y="641" font-family="Malgun Gothic, sans-serif" font-size="26" fill="#243C3E" font-weight="400" text-anchor="middle">키가 있으면 저장된 값을 그대로 반환한다</text><text x="340" y="683" font-family="Malgun Gothic, sans-serif" font-size="26" fill="#243C3E" font-weight="400" text-anchor="middle">None을 바꾸려면 별도 조건이 필요하다</text>
</svg>