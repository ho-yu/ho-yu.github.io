<svg xmlns="http://www.w3.org/2000/svg" width="680" height="720" viewBox="0 0 680 720" role="img" aria-labelledby="title desc">
<title id="title">리스트에서 딕셔너리로 이어지는 조회</title><desc id="desc">orders의 0번째 항목은 첫 주문 딕셔너리이며 그 안의 product 키를 읽으면 노트다. 리스트의 순번은 0부터 시작한다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#177B72"/></marker></defs>
<rect width="680" height="720" rx="24" fill="#F5F4EF"/>
<text x="38" y="55" font-family="Malgun Gothic, sans-serif" font-size="32" fill="#243C3E" font-weight="700" text-anchor="start">[]는 대상에 따라 뜻이 달라진다</text><rect x="30" y="90" width="620" height="174" rx="18" fill="#E4F2EC"/><text x="54" y="134" font-family="Malgun Gothic, sans-serif" font-size="29" fill="#243C3E" font-weight="700" text-anchor="start">orders · 리스트</text><rect x="54" y="160" width="267" height="77" rx="18" fill="#FFFFFF"/><rect x="342" y="160" width="284" height="77" rx="18" fill="#FFFFFF"/><text x="188" y="210" font-family="Malgun Gothic, sans-serif" font-size="29" fill="#243C3E" font-weight="400" text-anchor="middle">[0] 첫 주문</text><text x="484" y="210" font-family="Malgun Gothic, sans-serif" font-size="29" fill="#243C3E" font-weight="400" text-anchor="middle">[1] 다음 주문</text><path d="M188,266 L188,324" fill="none" stroke="#177B72" stroke-width="3" marker-end="url(#arrow)"/><text x="230" y="305" font-family="Consolas, monospace" font-size="29" fill="#243C3E" font-weight="400" text-anchor="start">orders[0]</text><rect x="30" y="340" width="620" height="151" rx="18" fill="#EAF1FC"/><text x="54" y="386" font-family="Malgun Gothic, sans-serif" font-size="29" fill="#243C3E" font-weight="700" text-anchor="start">첫 주문 · 딕셔너리</text><text x="54" y="445" font-family="Consolas, monospace" font-size="30" fill="#243C3E" font-weight="400" text-anchor="start">&quot;product&quot;</text><path d="M258,435 L383,435" fill="none" stroke="#177B72" stroke-width="3" marker-end="url(#arrow)"/><text x="433" y="445" font-family="Malgun Gothic, sans-serif" font-size="30" fill="#243C3E" font-weight="400" text-anchor="start">&quot;노트&quot;</text><path d="M340,496 L340,547" fill="none" stroke="#177B72" stroke-width="3" marker-end="url(#arrow)"/><text x="383" y="532" font-family="Consolas, monospace" font-size="27" fill="#243C3E" font-weight="400" text-anchor="start">[&quot;product&quot;]</text><rect x="30" y="563" width="620" height="105" rx="18" fill="#F0EBF8"/><text x="340" y="606" font-family="Consolas, monospace" font-size="30" fill="#243C3E" font-weight="400" text-anchor="middle">orders[0][&quot;product&quot;]</text><text x="340" y="647" font-family="Malgun Gothic, sans-serif" font-size="28" fill="#243C3E" font-weight="400" text-anchor="middle">조회 결과: 노트</text><text x="340" y="701" font-family="Malgun Gothic, sans-serif" font-size="25" fill="#243C3E" font-weight="400" text-anchor="middle">리스트는 순번 · 딕셔너리는 키</text>
</svg>