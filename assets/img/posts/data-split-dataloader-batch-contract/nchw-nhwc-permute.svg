<svg width="700" height="490" viewBox="0 0 700 490" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="700" height="490" fill="#f6f8fa" rx="10"/>
  <defs>
    <marker id="pm" markerWidth="8" markerHeight="8" refX="6.4" refY="3" orient="auto"><path d="M0,0 L6.4,3 L0,6 z" fill="#57606a"/></marker>
  </defs>
  <text x="350" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-weight="700">permute()는 값을 그대로 두고 차원의 순서만 재배치한다</text>

  <rect x="170" y="44" width="360" height="104" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="350" y="64" font-size="11" fill="#57606a" text-anchor="middle">NCHW — PyTorch Conv2d가 기대하는 순서</text>
  <rect x="190" y="76" width="80" height="48" rx="4" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="230" y="95" font-size="12.5" fill="#57606a" text-anchor="middle" font-weight="700">N</text>
  <text x="230" y="114" font-size="12" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">64</text>
  <rect x="270" y="76" width="80" height="48" rx="4" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="310" y="95" font-size="12.5" fill="#0969da" text-anchor="middle" font-weight="700">C</text>
  <text x="310" y="114" font-size="12" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">1</text>
  <rect x="350" y="76" width="80" height="48" rx="4" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="390" y="95" font-size="12.5" fill="#1a7f37" text-anchor="middle" font-weight="700">H</text>
  <text x="390" y="114" font-size="12" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">8</text>
  <rect x="430" y="76" width="80" height="48" rx="4" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/>
  <text x="470" y="95" font-size="12.5" fill="#8250df" text-anchor="middle" font-weight="700">W</text>
  <text x="470" y="114" font-size="12" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">8</text>
  <text x="350" y="141" font-size="13.5" fill="#24292f" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">[64, 1, 8, 8]</text>

  <line x1="250" y1="154" x2="250" y2="176" stroke="#57606a" stroke-width="1.4" marker-end="url(#pm)"/>
  <text x="268" y="164" font-size="12" fill="#24292f" font-weight="700" font-family="ui-monospace, monospace">permute(0, 2, 3, 1)</text>
  <text x="268" y="181" font-size="10.5" fill="#57606a">위 Tensor의 dim 0, 2, 3, 1을 순서대로 배치</text>

  <rect x="170" y="190" width="360" height="104" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="350" y="210" font-size="11" fill="#57606a" text-anchor="middle">NHWC — [B, H, W, C] 순서</text>
  <rect x="190" y="222" width="80" height="48" rx="4" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="230" y="241" font-size="12.5" fill="#57606a" text-anchor="middle" font-weight="700">N</text>
  <text x="230" y="260" font-size="12" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">64</text>
  <rect x="270" y="222" width="80" height="48" rx="4" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="310" y="241" font-size="12.5" fill="#1a7f37" text-anchor="middle" font-weight="700">H</text>
  <text x="310" y="260" font-size="12" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">8</text>
  <rect x="350" y="222" width="80" height="48" rx="4" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/>
  <text x="390" y="241" font-size="12.5" fill="#8250df" text-anchor="middle" font-weight="700">W</text>
  <text x="390" y="260" font-size="12" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">8</text>
  <rect x="430" y="222" width="80" height="48" rx="4" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="470" y="241" font-size="12.5" fill="#0969da" text-anchor="middle" font-weight="700">C</text>
  <text x="470" y="260" font-size="12" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">1</text>
  <text x="350" y="287" font-size="13.5" fill="#24292f" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">[64, 8, 8, 1]</text>

  <line x1="250" y1="300" x2="250" y2="322" stroke="#57606a" stroke-width="1.4" marker-end="url(#pm)"/>
  <text x="268" y="310" font-size="12" fill="#24292f" font-weight="700" font-family="ui-monospace, monospace">permute(0, 3, 1, 2)</text>
  <text x="268" y="327" font-size="10.5" fill="#57606a">위 Tensor의 dim 0, 3, 1, 2를 순서대로 배치</text>

  <rect x="170" y="336" width="360" height="104" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="350" y="356" font-size="11" fill="#57606a" text-anchor="middle">NCHW — 다시 원래 순서로</text>
  <rect x="190" y="368" width="80" height="48" rx="4" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="230" y="387" font-size="12.5" fill="#57606a" text-anchor="middle" font-weight="700">N</text>
  <text x="230" y="406" font-size="12" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">64</text>
  <rect x="270" y="368" width="80" height="48" rx="4" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="310" y="387" font-size="12.5" fill="#0969da" text-anchor="middle" font-weight="700">C</text>
  <text x="310" y="406" font-size="12" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">1</text>
  <rect x="350" y="368" width="80" height="48" rx="4" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="390" y="387" font-size="12.5" fill="#1a7f37" text-anchor="middle" font-weight="700">H</text>
  <text x="390" y="406" font-size="12" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">8</text>
  <rect x="430" y="368" width="80" height="48" rx="4" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/>
  <text x="470" y="387" font-size="12.5" fill="#8250df" text-anchor="middle" font-weight="700">W</text>
  <text x="470" y="406" font-size="12" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">8</text>
  <text x="350" y="433" font-size="13.5" fill="#24292f" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">[64, 1, 8, 8]</text>

  <text x="350" y="468" font-size="11.5" fill="#57606a" text-anchor="middle">차원의 위치만 바뀌고 pixel 값은 그대로 유지된다 (roundtrip_values_preserved = true)</text>
</svg>
