<svg width="720" height="628" viewBox="0 0 720 628" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="720" height="628" fill="#f6f8fa" rx="10"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6.4" refY="3" orient="auto"><path d="M0,0 L6.4,3 L0,6 z" fill="#57606a"/></marker></defs>
  <text x="360" y="28" font-size="14" fill="#24292f" text-anchor="middle" font-weight="700">CNN을 통과하며 Tensor Shape가 바뀌는 순서</text>
  <rect x="230" y="44" width="260" height="44" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.6"/>
  <text x="360" y="72" font-size="14" fill="#24292f" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">[B, 1, 8, 8]</text>
  <text x="218" y="72" font-size="11.5" fill="#57606a" text-anchor="end">입력 이미지</text>
  <line x1="290" y1="92" x2="290" y2="126" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="306" y="104" font-size="11.5" fill="#24292f" font-weight="700">Conv1</text>
  <text x="306" y="118" font-size="10.5" fill="#57606a" font-family="ui-monospace, monospace">nn.Conv2d(1, 8, kernel_size=3, padding=1)</text>
  <rect x="230" y="130" width="260" height="44" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
  <text x="360" y="158" font-size="14" fill="#24292f" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">[B, 8, 8, 8]</text>
  <text x="218" y="158" font-size="11.5" fill="#0969da" text-anchor="end">Conv1 출력</text>
  <line x1="290" y1="178" x2="290" y2="212" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="306" y="190" font-size="11.5" fill="#24292f" font-weight="700">Pool1</text>
  <text x="306" y="204" font-size="10.5" fill="#57606a" font-family="ui-monospace, monospace">nn.MaxPool2d(2)  ·  8x8 -> 4x4</text>
  <rect x="230" y="216" width="260" height="44" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/>
  <text x="360" y="244" font-size="14" fill="#24292f" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">[B, 8, 4, 4]</text>
  <text x="218" y="244" font-size="11.5" fill="#1a7f37" text-anchor="end">Pool1 출력</text>
  <line x1="290" y1="264" x2="290" y2="298" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="306" y="276" font-size="11.5" fill="#24292f" font-weight="700">Conv2</text>
  <text x="306" y="290" font-size="10.5" fill="#57606a" font-family="ui-monospace, monospace">채널 8 -> 16, H/W 유지</text>
  <rect x="230" y="302" width="260" height="44" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
  <text x="360" y="330" font-size="14" fill="#24292f" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">[B, 16, 4, 4]</text>
  <text x="218" y="330" font-size="11.5" fill="#0969da" text-anchor="end">Conv2 출력</text>
  <line x1="290" y1="350" x2="290" y2="384" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="306" y="362" font-size="11.5" fill="#24292f" font-weight="700">Pool2</text>
  <text x="306" y="376" font-size="10.5" fill="#57606a" font-family="ui-monospace, monospace">nn.MaxPool2d(2)  ·  4x4 -> 2x2</text>
  <rect x="230" y="388" width="260" height="44" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/>
  <text x="360" y="416" font-size="14" fill="#24292f" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">[B, 16, 2, 2]</text>
  <text x="218" y="416" font-size="11.5" fill="#1a7f37" text-anchor="end">Pool2 출력</text>
  <line x1="290" y1="436" x2="290" y2="470" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="306" y="448" font-size="11.5" fill="#24292f" font-weight="700">Flatten</text>
  <text x="306" y="462" font-size="10.5" fill="#57606a" font-family="ui-monospace, monospace">torch.flatten(x, start_dim=1)  ·  16 x 2 x 2 = 64</text>
  <rect x="230" y="474" width="260" height="44" rx="6" fill="#ffffff" stroke="#9a6700" stroke-width="1.6"/>
  <text x="360" y="502" font-size="14" fill="#24292f" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">[B, 64]</text>
  <text x="218" y="502" font-size="11.5" fill="#9a6700" text-anchor="end">Flatten 결과</text>
  <line x1="290" y1="522" x2="290" y2="556" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="306" y="534" font-size="11.5" fill="#24292f" font-weight="700">Linear</text>
  <text x="306" y="548" font-size="10.5" fill="#57606a" font-family="ui-monospace, monospace">nn.Linear(16 * 2 * 2, 10)</text>
  <rect x="230" y="560" width="260" height="44" rx="6" fill="#ffffff" stroke="#8250df" stroke-width="1.6"/>
  <text x="360" y="588" font-size="14" fill="#24292f" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">[B, 10]</text>
  <text x="218" y="588" font-size="11.5" fill="#8250df" text-anchor="end">최종 logits</text>
</svg>
