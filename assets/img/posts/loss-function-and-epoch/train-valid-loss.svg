<svg width="560" height="290" viewBox="0 0 560 290" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="560" height="290" fill="#f6f8fa" rx="10"/>
  <text x="280.0" y="26" font-size="14" fill="#24292f" text-anchor="middle" font-weight="700">Epoch가 늘어날 때 두 Loss가 움직이는 방향</text>
  <rect x="20" y="46" width="248" height="220" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="144" y="66" font-size="12.5" fill="#1a7f37" text-anchor="middle" font-weight="700">정상적인 학습</text>
  <line x1="52" y1="214" x2="226" y2="214" stroke="#57606a" stroke-width="1.5"/>
  <line x1="52" y1="214" x2="52" y2="74" stroke="#57606a" stroke-width="1.5"/>
  <text x="226" y="232" font-size="10.5" fill="#57606a" text-anchor="end" font-weight="400">Epoch</text>
  <text x="48" y="68" font-size="10.5" fill="#57606a" text-anchor="middle" font-weight="400">Loss</text>
  <path d="M 58 82 C 112 134, 148 180, 220 202" fill="none" stroke="#0969da" stroke-width="2.5"/>
  <text x="218" y="188" font-size="11" fill="#0969da" text-anchor="end" font-weight="700">Train ↓</text>
  <path d="M 58 104 C 116 150, 152 188, 220 210" fill="none" stroke="#1a7f37" stroke-width="2.5"/>
  <text x="104" y="152" font-size="11" fill="#1a7f37" text-anchor="middle" font-weight="700">Valid ↓</text>
  <text x="144" y="252" font-size="11" fill="#57606a" text-anchor="middle" font-weight="400">학습 데이터와 새 데이터 모두 좋아진다</text>
  <rect x="302" y="46" width="248" height="220" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="426" y="66" font-size="12.5" fill="#cf222e" text-anchor="middle" font-weight="700">과적합 (Overfitting)</text>
  <line x1="334" y1="214" x2="508" y2="214" stroke="#57606a" stroke-width="1.5"/>
  <line x1="334" y1="214" x2="334" y2="74" stroke="#57606a" stroke-width="1.5"/>
  <text x="508" y="232" font-size="10.5" fill="#57606a" text-anchor="end" font-weight="400">Epoch</text>
  <text x="330" y="68" font-size="10.5" fill="#57606a" text-anchor="middle" font-weight="400">Loss</text>
  <path d="M 340 82 C 394 134, 430 180, 502 202" fill="none" stroke="#0969da" stroke-width="2.5"/>
  <text x="500" y="188" font-size="11" fill="#0969da" text-anchor="end" font-weight="700">Train ↓</text>
  <path d="M 340 118 C 404 114, 444 102, 502 86" fill="none" stroke="#cf222e" stroke-width="2.5"/>
  <text x="502" y="78" font-size="11" fill="#cf222e" text-anchor="end" font-weight="700">Valid ↑</text>
  <text x="426" y="252" font-size="11" fill="#57606a" text-anchor="middle" font-weight="400">학습 데이터를 지나치게 외우기 시작한 상태</text>
</svg>
