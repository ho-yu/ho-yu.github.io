<svg width="720" height="292" viewBox="0 0 720 292" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="720" height="292" fill="#f6f8fa" rx="10"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6.4" refY="3" orient="auto"><path d="M0,0 L6.4,3 L0,6 z" fill="#57606a"/></marker>
  <marker id="ao" markerWidth="8" markerHeight="8" refX="6.4" refY="3" orient="auto"><path d="M0,0 L6.4,3 L0,6 z" fill="#9a6700"/></marker></defs>
  <text x="360" y="26" font-size="14" fill="#24292f" text-anchor="middle" font-weight="700">Gradient의 크기는 민감도, 부호는 수정 방향을 뜻한다</text>
  <line x1="240" y1="62" x2="240" y2="222" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="240" y="56" font-size="10.5" fill="#57606a" text-anchor="middle">0</text>
  <text x="60" y="93" font-size="13" fill="#24292f" text-anchor="start" font-weight="700">W1</text>
  <text x="100" y="93" font-size="12" fill="#0969da" text-anchor="start" font-family="ui-monospace, monospace">+0.8</text>
  <rect x="240" y="77" width="150.0" height="22" rx="3" fill="#eaf2fb" stroke="#0969da" stroke-width="1.6"/>
  <text x="690" y="93" font-size="11" fill="#57606a" text-anchor="end">Loss에 대한 민감도가 큼</text>
  <text x="60" y="143" font-size="13" fill="#24292f" text-anchor="start" font-weight="700">W2</text>
  <text x="100" y="143" font-size="12" fill="#8250df" text-anchor="start" font-family="ui-monospace, monospace">-0.1</text>
  <rect x="221.25" y="127" width="18.75" height="22" rx="3" fill="#f3eefc" stroke="#8250df" stroke-width="1.6"/>
  <text x="690" y="143" font-size="11" fill="#57606a" text-anchor="end">어느 정도 영향</text>
  <text x="60" y="193" font-size="13" fill="#24292f" text-anchor="start" font-weight="700">W3</text>
  <text x="100" y="193" font-size="12" fill="#57606a" text-anchor="start" font-family="ui-monospace, monospace">+0.001</text>
  <rect x="240" y="177" width="2" height="22" rx="3" fill="#eef1f4" stroke="#57606a" stroke-width="1.6"/>
  <text x="690" y="193" font-size="11" fill="#57606a" text-anchor="end">현재 Loss에 거의 영향을 주지 않음</text>
  <line x1="60" y1="236" x2="690" y2="236" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="360" y="258" font-size="11.5" fill="#24292f" text-anchor="middle">gradient &gt; 0  →  W를 감소시키는 방향이 Loss 감소 방향</text>
  <text x="360" y="278" font-size="11.5" fill="#24292f" text-anchor="middle">gradient &lt; 0  →  W를 증가시키는 방향이 Loss 감소 방향</text>
</svg>
