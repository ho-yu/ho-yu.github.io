<svg width="720" height="344" viewBox="0 0 720 344" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="720" height="344" fill="#f6f8fa" rx="10"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6.4" refY="3" orient="auto"><path d="M0,0 L6.4,3 L0,6 z" fill="#57606a"/></marker>
  <marker id="ao" markerWidth="8" markerHeight="8" refX="6.4" refY="3" orient="auto"><path d="M0,0 L6.4,3 L0,6 z" fill="#9a6700"/></marker></defs>
  <text x="360" y="26" font-size="14" fill="#24292f" text-anchor="middle" font-weight="700">각 단계가 답하는 질문은 서로 다르다</text>
  <rect x="40" y="56" width="640" height="60" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="72" cy="86" r="15" fill="#eaf2fb" stroke="#0969da" stroke-width="1.8"/>
  <text x="72" y="91" font-size="13" fill="#0969da" text-anchor="middle" font-weight="700">1</text>
  <text x="104" y="82" font-size="13" fill="#0969da" text-anchor="start" font-weight="700">Forward</text>
  <text x="664" y="82" font-size="11" fill="#57606a" text-anchor="end" font-family="ui-monospace, monospace">model(x)</text>
  <text x="104" y="102" font-size="11" fill="#57606a" text-anchor="start">현재 모델이 어떤 답을 내는가?</text>
  <line x1="72" y1="118" x2="72" y2="122" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="40" y="124" width="640" height="60" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="72" cy="154" r="15" fill="#fdf3e3" stroke="#9a6700" stroke-width="1.8"/>
  <text x="72" y="159" font-size="13" fill="#9a6700" text-anchor="middle" font-weight="700">2</text>
  <text x="104" y="150" font-size="13" fill="#9a6700" text-anchor="start" font-weight="700">Loss</text>
  <text x="664" y="150" font-size="11" fill="#57606a" text-anchor="end" font-family="ui-monospace, monospace">criterion(pred, y)</text>
  <text x="104" y="170" font-size="11" fill="#57606a" text-anchor="start">얼마나 틀렸는가?</text>
  <line x1="72" y1="186" x2="72" y2="190" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="40" y="192" width="640" height="60" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="72" cy="222" r="15" fill="#f3eefc" stroke="#8250df" stroke-width="1.8"/>
  <text x="72" y="227" font-size="13" fill="#8250df" text-anchor="middle" font-weight="700">3</text>
  <text x="104" y="218" font-size="13" fill="#8250df" text-anchor="start" font-weight="700">Backward</text>
  <text x="664" y="218" font-size="11" fill="#57606a" text-anchor="end" font-family="ui-monospace, monospace">loss.backward()</text>
  <text x="104" y="238" font-size="11" fill="#57606a" text-anchor="start">이 Loss를 줄이려면 각 파라미터를 어느 방향으로 얼마나 수정해야 하는가?</text>
  <line x1="72" y1="254" x2="72" y2="258" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="40" y="260" width="640" height="60" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="72" cy="290" r="15" fill="#eaf6ec" stroke="#1a7f37" stroke-width="1.8"/>
  <text x="72" y="295" font-size="13" fill="#1a7f37" text-anchor="middle" font-weight="700">4</text>
  <text x="104" y="286" font-size="13" fill="#1a7f37" text-anchor="start" font-weight="700">Optimizer</text>
  <text x="664" y="286" font-size="11" fill="#57606a" text-anchor="end" font-family="ui-monospace, monospace">optimizer.step()</text>
  <text x="104" y="306" font-size="11" fill="#57606a" text-anchor="start">실제 파라미터 수정</text>
</svg>
