  <text x="292" y="120" font-size="10.5" fill="#9a6700" text-anchor="start" font-weight="700">− 최댓값 1002   (수치 안정화)</text>
  <line x1="275" y1="176" x2="275" y2="198" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="292" y="192" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="700" font-family="ui-monospace, monospace">exp()</text>
