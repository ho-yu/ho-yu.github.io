  <text x="580" y="148" font-size="11" fill="#24292f" text-anchor="middle" font-family="ui-monospace, monospace">0 − (−1) = 1</text>
  <line x1="500" y1="168" x2="660" y2="168" stroke="#1a7f37" stroke-width="1.2"/>
  <text x="580" y="196" font-size="11" fill="#57606a" text-anchor="middle">그래서 Softmax</text>
