<svg width="420" height="320" viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ax" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="420" height="320" fill="#f6f8fa" rx="10"/>
  <text x="210" y="20" font-size="14.5" font-weight="700" fill="#24292f" text-anchor="middle">선형 결정 경계 — 직선이 평면을 두 class로 나눈다</text>

  <!-- two half-plane regions, split along the diagonal from bottom-left to top-right -->
  <polygon points="40,34 360,34 40,270" fill="#dbeafe" opacity="0.7"/>
  <polygon points="360,34 360,270 40,270" fill="#fde7c7" opacity="0.7"/>

  <!-- decision boundary line -->
  <line x1="40" y1="270" x2="360" y2="34" stroke="#cf222e" stroke-width="2.5"/>

  <!-- axes -->
  <line x1="40" y1="270" x2="400" y2="270" stroke="#57606a" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="40" y1="270" x2="40" y2="14" stroke="#57606a" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="396" y="286" font-size="13" fill="#57606a" font-family="ui-monospace, monospace" text-anchor="end">x₁</text>
  <text x="26" y="20" font-size="13" fill="#57606a" font-family="ui-monospace, monospace">x₂</text>

  <!-- region labels -->
  <text x="110" y="90" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="700">class 0</text>
  <text x="290" y="230" font-size="15" fill="#b45309" text-anchor="middle" font-weight="700">class 1</text>

  <!-- boundary equation label -->
  <rect x="150" y="122" width="182" height="24" fill="#f6f8fa" opacity="0.9"/>
  <text x="241" y="139" font-size="13.5" fill="#cf222e" text-anchor="middle" font-family="ui-monospace, monospace">x₁w₁ + x₂w₂ + b = 0</text>

  <text x="210" y="305" font-size="11.5" fill="#57606a" text-anchor="middle">퍼셉트론 하나는 2차원에서 직선, 3차원에서 평면, 더 높은 차원에서는 초평면으로 나눈다</text>
</svg>
