<svg width="720" height="330" viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="720" height="330" fill="#f6f8fa" rx="10"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6.4" refY="3" orient="auto"><path d="M0,0 L6.4,3 L0,6 z" fill="#57606a"/></marker>
  <marker id="ao" markerWidth="8" markerHeight="8" refX="6.4" refY="3" orient="auto"><path d="M0,0 L6.4,3 L0,6 z" fill="#9a6700"/></marker></defs>
  <text x="360" y="26" font-size="14" fill="#24292f" text-anchor="middle" font-weight="700">batch_first는 축의 순서만 바꾸는 옵션이다</text>
  <rect x="30" y="44" width="320" height="190" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="190" y="68" font-size="11.5" fill="#24292f" text-anchor="middle" font-weight="700">batch_first=False  (PyTorch 기본값)</text>
  <text x="190" y="106" font-size="20" fill="#57606a" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">[L, B, D]</text>
  <line x1="60" y1="120" x2="320" y2="120" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="120" y="144" font-size="12" fill="#57606a" text-anchor="end" font-weight="700" font-family="ui-monospace, monospace">L</text>
  <text x="134" y="144" font-size="11.5" fill="#57606a" text-anchor="start">→  Sequence Length</text>
  <text x="120" y="166" font-size="12" fill="#57606a" text-anchor="end" font-weight="700" font-family="ui-monospace, monospace">B</text>
  <text x="134" y="166" font-size="11.5" fill="#57606a" text-anchor="start">→  Batch</text>
  <text x="120" y="188" font-size="12" fill="#57606a" text-anchor="end" font-weight="700" font-family="ui-monospace, monospace">D</text>
  <text x="134" y="188" font-size="11.5" fill="#57606a" text-anchor="start">→  Feature</text>
  <rect x="370" y="44" width="320" height="190" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="530" y="68" font-size="11.5" fill="#24292f" text-anchor="middle" font-weight="700">batch_first=True  (이번 코드)</text>
  <text x="530" y="106" font-size="20" fill="#0969da" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">[B, L, D]</text>
  <line x1="400" y1="120" x2="660" y2="120" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="460" y="144" font-size="12" fill="#0969da" text-anchor="end" font-weight="700" font-family="ui-monospace, monospace">B</text>
  <text x="474" y="144" font-size="11.5" fill="#57606a" text-anchor="start">→  Batch</text>
  <text x="460" y="166" font-size="12" fill="#0969da" text-anchor="end" font-weight="700" font-family="ui-monospace, monospace">L</text>
  <text x="474" y="166" font-size="11.5" fill="#57606a" text-anchor="start">→  Sequence Length</text>
  <text x="460" y="188" font-size="12" fill="#0969da" text-anchor="end" font-weight="700" font-family="ui-monospace, monospace">D</text>
  <text x="474" y="188" font-size="11.5" fill="#57606a" text-anchor="start">→  Feature</text>
  <text x="530" y="216" font-size="11.5" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">x.shape = [2, 5, 4]</text>
  <text x="360" y="258" font-size="11.5" fill="#57606a" text-anchor="middle">값이나 성능이 달라지는 옵션이 아니라 가독성과 사용 편의성을 위한 옵션이다</text>
  <rect x="110" y="274" width="500" height="38" rx="8" fill="#fdf3e3" stroke="#9a6700" stroke-width="1.6"/>
  <text x="360" y="298" font-size="12" fill="#9a6700" text-anchor="middle" font-weight="700">예외 : h_n 에는 batch_first=True 가 적용되지 않는다</text>
</svg>
