<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" role="img" aria-labelledby="title desc"><title id="title">토큰과 ID, 임베딩의 역할</title><desc id="desc">설명용 분할과 ID로 텍스트부터 문맥 계산까지의 별도 단계를 표시한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#536b89"/></marker></defs><rect width="640" height="520" fill="#ffffff"/><g font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif"><text x="320" y="38" font-size="28" fill="#203e63" text-anchor="middle" font-weight="700">토큰화 → ID → 벡터 → 문맥</text><rect x="50" y="60" width="540" height="66" rx="8" fill="#eff6ff" stroke="#557bb4" stroke-width="2"/><text x="320" y="87" font-size="24" fill="#203e63" text-anchor="middle" font-weight="700">텍스트</text><text x="320" y="113" font-size="23" fill="#22334b" text-anchor="middle" font-weight="500">재설치</text><path d="M320 127 L320 143" fill="none" stroke="#536b89" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="146" width="540" height="66" rx="8" fill="#eff6ff" stroke="#557bb4" stroke-width="2"/><text x="320" y="173" font-size="24" fill="#203e63" text-anchor="middle" font-weight="700">토큰으로 분할</text><text x="320" y="199" font-size="23" fill="#22334b" text-anchor="middle" font-weight="500">재  |  설치</text><path d="M320 213 L320 229" fill="none" stroke="#536b89" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="232" width="540" height="66" rx="8" fill="#eff6ff" stroke="#557bb4" stroke-width="2"/><text x="320" y="259" font-size="24" fill="#203e63" text-anchor="middle" font-weight="700">어휘사전에서 ID 조회</text><text x="320" y="285" font-size="23" fill="#22334b" text-anchor="middle" font-weight="500">재 ↔ 7,  설치 ↔ 2</text><path d="M320 299 L320 315" fill="none" stroke="#536b89" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="318" width="540" height="66" rx="8" fill="#ecf8f3" stroke="#3d8971" stroke-width="2"/><text x="320" y="345" font-size="24" fill="#203e63" text-anchor="middle" font-weight="700">임베딩 행렬 E의 행 조회</text><text x="320" y="371" font-size="23" fill="#22334b" text-anchor="middle" font-weight="500">E[7], E[2] → 두 개의 벡터</text><path d="M320 385 L320 401" fill="none" stroke="#536b89" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="404" width="540" height="66" rx="8" fill="#ecf8f3" stroke="#3d8971" stroke-width="2"/><text x="320" y="431" font-size="24" fill="#203e63" text-anchor="middle" font-weight="700">모델에서 문맥 계산</text><text x="320" y="457" font-size="23" fill="#22334b" text-anchor="middle" font-weight="500">주변 토큰의 관계 반영</text><text x="320" y="513" font-size="20" fill="#59697d" text-anchor="middle" font-weight="500">분할·ID는 설명용 가정</text></g></svg>
