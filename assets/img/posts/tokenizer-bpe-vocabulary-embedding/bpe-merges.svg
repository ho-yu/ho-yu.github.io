<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" role="img" aria-labelledby="title desc"><title id="title">BPE의 두 단계 병합</title><desc id="desc">cat 세 번과 cap 두 번에서 c a가 다섯 번으로 최빈 쌍이며, 병합 후 ca t가 세 번으로 최빈 쌍이다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#536b89"/></marker></defs><rect width="640" height="600" fill="#ffffff"/><g font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif"><text x="320" y="38" font-size="27" fill="#203e63" text-anchor="middle" font-weight="700">BPE 학습: 가장 빈번한 인접 쌍 병합</text><text x="320" y="76" font-size="24" fill="#22334b" text-anchor="middle" font-weight="500">설명용 말뭉치: cat 3회 · cap 2회</text><rect x="90" y="100" width="460" height="100" rx="8" fill="#eff6ff" stroke="#557bb4" stroke-width="2"/><text x="240" y="140" font-size="30" fill="#22334b" text-anchor="middle" font-weight="500">c  |  a  |  t</text><text x="474" y="140" font-size="26" fill="#22334b" text-anchor="middle" font-weight="500">× 3</text><text x="240" y="181" font-size="30" fill="#22334b" text-anchor="middle" font-weight="500">c  |  a  |  p</text><text x="474" y="181" font-size="26" fill="#22334b" text-anchor="middle" font-weight="500">× 2</text><path d="M320 205 L320 252" fill="none" stroke="#536b89" stroke-width="2.5" marker-end="url(#arrow)"/><text x="328" y="230" font-size="23" fill="#255b8a" text-anchor="start" font-weight="600">c + a : 5회</text><rect x="90" y="260" width="460" height="100" rx="8" fill="#eff6ff" stroke="#557bb4" stroke-width="2"/><text x="240" y="300" font-size="30" fill="#22334b" text-anchor="middle" font-weight="500">ca  |  t</text><text x="474" y="300" font-size="26" fill="#22334b" text-anchor="middle" font-weight="500">× 3</text><text x="240" y="341" font-size="30" fill="#22334b" text-anchor="middle" font-weight="500">ca  |  p</text><text x="474" y="341" font-size="26" fill="#22334b" text-anchor="middle" font-weight="500">× 2</text><path d="M320 365 L320 412" fill="none" stroke="#536b89" stroke-width="2.5" marker-end="url(#arrow)"/><text x="328" y="390" font-size="23" fill="#255b8a" text-anchor="start" font-weight="600">ca + t : 3회</text><rect x="90" y="420" width="460" height="100" rx="8" fill="#ecf8f3" stroke="#3d8971" stroke-width="2"/><text x="240" y="460" font-size="30" fill="#22334b" text-anchor="middle" font-weight="500">cat</text><text x="474" y="460" font-size="26" fill="#22334b" text-anchor="middle" font-weight="500">× 3</text><text x="240" y="501" font-size="30" fill="#22334b" text-anchor="middle" font-weight="500">ca  |  p</text><text x="474" y="501" font-size="26" fill="#22334b" text-anchor="middle" font-weight="500">× 2</text><text x="320" y="559" font-size="24" fill="#203e63" text-anchor="middle" font-weight="700">병합 순서: c+a → ca+t</text><text x="320" y="589" font-size="22" fill="#59697d" text-anchor="middle" font-weight="500">기존 조각은 유지 · 새 토큰 ca, cat 추가</text></g></svg>
